[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q -p no:cacheprovider --strict-markers
markers =
    unit: 纯函数内核（无 IO、无数据库）
    api: HTTP 接口与业务流
    e2e: 浏览器端到端（Playwright）
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestRemovedIn10Warning
