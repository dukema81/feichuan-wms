        document.getElementById("logGo").addEventListener("click", function () {
          F.go("logs", { q: document.getElementById("logQ").value.trim() });
        });
        F.setStatus("操作日志 · 共 " + d.total + " 条");
        F.setSide('<div class="side-block"><div class="hd">说明</div><div class="bd small muted" ' +
          'style="line-height:1.9">所有写操作都会落审计日志：登录、单据创建与状态推进、' +
          '收货上架、分配拣货、发运、盘点调整、集成配置变更等。</div></div>');
      }).catch(function (e) { F.toast(e.message, "err"); });
  });

  /* ---------------------------------------------------------- 启动 */
  F.boot = function () {
    return F.api("GET", "/api/bootstrap").then(function (d) {
      F.state.boot = d;
      var u = d.user;
      var op = document.getElementById("opFoot");
      if (op) op.textContent = "操作员：" + u.displayName + "（" + u.roleLabel + "）";
      var sku = document.getElementById("skuLabel");
      if (sku) sku.textContent = "在库 SKU：" + d.kpi.skuCount;
      var pk = document.getElementById("pickLabel");
      if (pk) pk.textContent = "待拣任务：" + d.kpi.pickPending;
      var ut = document.getElementById("utilLabel");
      if (ut) ut.textContent = "库容：" + F.pct(d.kpi.locUtil, 1);
      return d;
    });
  };

  function start() {
    if (!localStorage.getItem(TOKEN_KEY)) { location.href = "./login.html"; return; }
    F.boot().then(function () {
      render();
      window.addEventListener("hashchange", render);
      var lo = document.getElementById("btnLogout");
      if (lo) lo.addEventListener("click", function () {
        F.api("POST", "/api/auth/logout", {}).then(function () {
          localStorage.removeItem(TOKEN_KEY);
          document.cookie = "wms_token=; path=/; max-age=0";
          location.href = "./login.html";
        }).catch(function () {
          localStorage.removeItem(TOKEN_KEY);
          location.href = "./login.html";
        });
      });
    }).catch(function (e) {
      if (e.status === 401) return;
      document.getElementById("view").innerHTML =
        '<div class="panel"><div class="panel-body">初始化失败：' + F.esc(e.message) + "</div></div>";
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})(window, document);

</script>
<script>
/* 飞传 WMS · 入库作业：到货通知（ASN）→ 收货 → 质检 → 上架 */
(function (window, document) {
  "use strict";
  var F = window.F;

  var ST = ["全部", "已预约", "已到货", "收货中", "已收货", "已上架", "已关闭"];

  F.register("inbound", function (params) {
    var st = params.st || "全部";
    var tab = params.tab || "asn";

    function load() {
      var q = st === "全部" ? "" : "&status=" + encodeURIComponent(st);
      Promise.all([
        F.api("GET", "/api/asns?limit=80" + q),
        F.api("GET", "/api/putaway?limit=60")
      ]).then(function (res) {
        var d = res[0], p = res[1];
        var c = d.counts || {};
        var pendingTask = (p.list || []).filter(function (x) { return x.status === "待执行"; });
        var html = '<div class="panel"><div class="panel-title">入库作业' +
          '<span class="panel-actions">' +
          '<button class="btn sm" id="asnNew">新建到货通知</button>' +
          '<button class="btn sm" id="asnRefresh">刷新</button></span></div>' +
          '<div class="panel-body">' +
          '<div class="kpi-grid four">' +
          '<div class="kpi"><div class="k-label">待收货</div><div class="k-value">' +
          ((c["已到货"] || 0) + (c["收货中"] || 0)) +
          '</div><div class="k-sub">已到货 ' + (c["已到货"] || 0) + " · 收货中 " +
          (c["收货中"] || 0) + "</div></div>" +
          '<div class="kpi gold"><div class="k-label">在途预约</div><div class="k-value">' +
          (c["已预约"] || 0) + '</div><div class="k-sub">草稿 ' + (c["草稿"] || 0) + " 单</div></div>" +
          '<div class="kpi green"><div class="k-label">待上架任务</div><div class="k-value">' +
          pendingTask.length + '</div><div class="k-sub">已完成 ' +
          (p.list || []).filter(function (x) { return x.status === "已完成"; }).length +
          " 条</div></div>" +
          '<div class="kpi"><div class="k-label">已上架 / 已关闭</div><div class="k-value">' +
          ((c["已上架"] || 0) + (c["已关闭"] || 0)) +
          '</div><div class="k-sub">单据合计 ' + d.total + " 单</div></div></div>" +
          F.chips([["asn", "到货通知 (" + d.total + ")"], ["putaway", "上架任务 (" +
            pendingTask.length + ")"]], tab, "data-tab") +
          "</div></div>";

        html += '<div class="panel"><div class="panel-title">' +
          (tab === "asn" ? "到货通知" : "上架任务") +
          (tab === "asn" ? F.chips(ST.map(function (x) {
            return [x, x, x === "全部" ? d.total : (c[x] || 0)];
          }), st, "data-st") : "") +
          "</div><div class='panel-body flush' id='inBody'></div></div>";

        document.getElementById("view").innerHTML = html;

        var body = document.getElementById("inBody");
        if (tab === "asn") {
          body.innerHTML = F.table([
            { label: "单号", render: function (r) { return '<span class="mono">' + F.esc(r.no) + "</span>" +
              (r.priority === "加急" ? ' <span class="tag red">加急</span>' : ""); } },
            { label: "供应商", render: function (r) { return F.esc(r.supplierName) +
              '<div class="muted small mono">' + F.esc(r.poNo || "") + "</div>"; } },
            { label: "预约到货", render: function (r) { return '<span class="mono small">' +
              F.esc(r.expectDate) + "</span>"; } },
            { label: "行 / 量", num: true, render: function (r) {
              return r.lineCount + " 行 · " + F.qty(r.qty);
            } },
            { label: "收货进度", render: function (r) {
              return '<div class="util-cell">' + F.progress(r.receivedRate) +
                '<span class="small">' + F.pct(r.receivedRate, 0) + "</span></div>";
            } },
            { label: "状态", render: function (r) { return F.tag(r.status); } },
            { label: "到货时间", render: function (r) { return '<span class="small muted">' +
              F.esc(r.arriveAt || "—") + "</span>"; } }
          ], d.list, { click: function (r) { return r.no; }, empty: "该状态下没有单据" });
          F.bindRows(document, openAsn);
        } else {
          body.innerHTML = F.table([
            { label: "任务号", render: function (r) { return '<span class="mono">' + F.esc(r.no) + "</span>"; } },
            { label: "ASN", render: function (r) { return '<span class="mono small">' + F.esc(r.asn_no) + "</span>"; } },
            { label: "物料", render: function (r) { return F.esc(r.item) +
              '<div class="muted small">' + F.esc(r.name) + "</div>"; } },
            { label: "批次", render: function (r) { return '<span class="mono small">' + F.esc(r.lot) + "</span>"; } },
            { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
            { label: "建议货位", render: function (r) { return '<span class="mono small">' + F.esc(r.to_loc) + "</span>"; } },
            { label: "状态", render: function (r) { return F.tag(r.status); } },
            { label: "", render: function (r) {
              return r.status === "待执行" ? '<button class="btn sm primary" data-put="' + F.esc(r.no) +
                '">执行上架</button>' : '<span class="small muted">' + F.esc(r.done_at || "") + "</span>";
            } }
          ], p.list, { empty: "暂无上架任务" });
          body.querySelectorAll("[data-put]").forEach(function (b) {
            b.addEventListener("click", function () { doPutaway(b.getAttribute("data-put")); });
          });
        }

        document.querySelectorAll("[data-st]").forEach(function (b) {
          b.addEventListener("click", function () {
            F.go("inbound", { st: b.getAttribute("data-st"), tab: tab });
          });
        });
        document.querySelectorAll("[data-tab]").forEach(function (b) {
          b.addEventListener("click", function () {
            F.go("inbound", { st: st, tab: b.getAttribute("data-tab") });
          });
        });
        var nb = document.getElementById("asnNew");
        if (nb) nb.addEventListener("click", newAsn);
        var rf = document.getElementById("asnRefresh");
        if (rf) rf.addEventListener("click", function () { F.go("inbound", { st: st, tab: tab }); });

        F.setSide('<div class="side-block"><div class="hd">入库流程</div><div class="bd small" ' +
          'style="line-height:2">草稿 → 已预约 → 已到货 → 收货中 → 已收货 → 已上架 → 已关闭' +
          '<div class="muted" style="margin-top:8px">· 收货超收容差 5%、短少需填差异原因<br>' +
          '· 质检合格或让步接收才允许上架<br>· 上架完成即写库存与批次</div></div></div>');
        F.setStatus("入库作业 · " + d.total + " 张到货通知");
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    /* ---------------- ASN 详情 ---------------- */
    function openAsn(no) {
      F.api("GET", "/api/asns/" + no).then(function (v) {
        var ctx = v.gate.ctx;
        var rows = (v.items || []).map(function (x) {
          return {
            line: x.line, item: x.item, name: x.name, qty: x.qty, receivedQty: x.receivedQty,
            lot: x.lot, expiry: x.expiry, qcStatus: x.qcStatus, diffReason: x.diffReason
          };
        });
        var html = '<div class="kpi-grid four">' +
          '<div class="kpi"><div class="k-label">计划数量</div><div class="k-value">' +
          F.qty(v.qty) + '</div><div class="k-sub">' + v.lineCount + " 行明细</div></div>" +
          '<div class="kpi green"><div class="k-label">已收数量</div><div class="k-value">' +
          F.qty(v.receivedQty) + '</div><div class="k-sub">完成度 ' + F.pct(v.receivedRate, 0) +
          "</div></div>" +
          '<div class="kpi"><div class="k-label">质检</div><div class="k-value">' +
          (ctx.qcDone ? (ctx.qcOk ? "合格" : "不合格") : "待检") +
          '</div><div class="k-sub">' + (ctx.qcDone ? "已完成判定" : "需抽检") + "</div></div>" +
          '<div class="kpi gold"><div class="k-label">上架任务</div><div class="k-value">' +
          ctx.taskCount + '</div><div class="k-sub">' + (ctx.putawayDone ? "已全部完成" : "待执行") +
          "</div></div></div>";

        html += '<div class="kv-grid">' +
          F.kv("供应商", F.esc(v.supplierName) + ' <span class="muted small mono">' +
            F.esc(v.supplier) + "</span>") +
          F.kv("采购单号", F.esc(v.poNo || "—")) +
          F.kv("预约到货", F.esc(v.expectDate)) +
          F.kv("实际到货", F.esc(v.arriveAt || "—")) +
          F.kv("月台", F.esc(v.dock || "—")) +
          F.kv("当前状态", F.tag(v.status)) +
          F.kv("创建", F.esc(v.createdAt)) +
          F.kv("优先级", F.prio(v.priority)) + "</div>";

        html += '<div class="gate-box"><div class="gate-hd">状态闸口</div>' +
          (v.gate.gates || []).map(function (g) {
            return '<div class="gate ' + (g.ok ? "ok" : "bad") + '"><b>' +
              (g.ok ? "✓" : "✕") + " " + F.esc(g.target) + "</b>" +
              (g.ok ? '<span class="muted small">可以推进</span>' :
                "<span>" + g.missing.map(F.esc).join("；") + "</span>") + "</div>";
          }).join("") + "</div>";

        html += '<div class="sub-title">收货明细</div>' + F.table([
          { label: "#", render: function (r) { return r.line; } },
          { label: "物料", render: function (r) { return F.esc(r.item) +
            '<div class="muted small">' + F.esc(r.name) + "</div>"; } },
          { label: "计划", num: true, render: function (r) { return F.qty(r.qty); } },
          { label: "已收", num: true, render: function (r) { return F.qty(r.receivedQty); } },
          { label: "批次", render: function (r) { return '<span class="mono small">' + F.esc(r.lot) + "</span>"; } },
          { label: "有效期", render: function (r) { return '<span class="small">' + F.esc(r.expiry || "—") + "</span>"; } },
          { label: "质检", render: function (r) { return F.tag(r.qcStatus); } }
        ], rows);

        if ((v.tasks || []).length) {
          html += '<div class="sub-title">上架任务</div>' + F.table([
            { label: "任务号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
            { label: "物料", render: function (r) { return F.esc(r.item); } },
            { label: "批次", render: function (r) { return '<span class="mono small">' + F.esc(r.lot) + "</span>"; } },
            { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
            { label: "目标货位", render: function (r) { return '<span class="mono small">' + F.esc(r.to_loc) + "</span>"; } },
            { label: "状态", render: function (r) { return F.tag(r.status); } },
            { label: "", render: function (r) {
              return r.status === "待执行" ? '<button class="btn sm primary" data-put="' + F.esc(r.no) +
                '">执行上架</button>' : "";
            } }
          ], v.tasks);
        }

        var btns = [];
        if (v.status === "草稿") btns.push(["stage:已预约", "预约到货", "primary"]);
        if (v.status === "已预约") btns.push(["stage:已到货", "登记到货", "primary"]);
        if (v.status === "已到货" || v.status === "收货中") btns.push(["receive", "登记收货", "primary"]);
        if (v.status === "收货中") btns.push(["stage:已收货", "收货完成", ""]);
        if (v.status === "已收货") {
          btns.push(["qc", "质检判定", ""]);
          btns.push(["putaway", "生成上架任务", "primary"]);
        }
        if (v.status === "已上架") btns.push(["stage:已关闭", "关闭单据", "primary"]);
        if (v.gate.cancelable) btns.push(["cancel", "取消单据", "danger"]);
        var foot = btns.map(function (b) {
          return '<button class="btn ' + b[2] + '" data-act="' + b[0] + '">' + b[1] + "</button>";
        }).join("") + '<button class="btn" data-close-foot="1">关闭</button>';

        var dlg = F.dialogWide("到货通知 " + v.no + " · " + v.status, html, foot);
        dlg.querySelector("[data-close-foot]").addEventListener("click", F.closeDialog);
        dlg.querySelectorAll("[data-act]").forEach(function (b) {
          b.addEventListener("click", function () {
            var act = b.getAttribute("data-act");
            if (act.indexOf("stage:") === 0) return doStage(v.no, act.slice(6));
            if (act === "receive") return doReceive(v);
            if (act === "qc") return doQc(v);
            if (act === "putaway") return doPutawayGen(v.no);
            if (act === "cancel") return doCancel(v.no);
          });
        });
        dlg.querySelectorAll("[data-put]").forEach(function (b) {
          b.addEventListener("click", function () { doPutaway(b.getAttribute("data-put")); });
        });
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function doStage(no, target) {
      F.api("POST", "/api/asns/" + no + "/stage", { target: target, arriveAt: null })
        .then(function () {
          F.toast("已推进到「" + target + "」", "ok");
          F.closeDialog(); load(); F.boot();
        }).catch(function (e) {
          F.toast(e.message, "err");
        });
    }

    function doReceive(v) {
      var pending = (v.items || []).filter(function (x) { return x.receivedQty < x.qty; });
      if (!pending.length) { F.toast("所有明细已收齐，可直接点「收货完成」", "err"); return; }
      var body = '<div class="form-grid">' + pending.map(function (x) {
        var left = x.qty - x.receivedQty;
        return '<label class="full">' + F.esc(x.item) + " " + F.esc(x.name) +
          ' <span class="muted small">待收 ' + F.qty(left) + "</span>" +
          '<div class="row-flex"><input class="inp" data-recv="' + x.line + '" type="number" value="' +
          left + '" min="0" max="' + left + '" step="1">' +
          '<input class="inp" data-lot="' + x.line + '" value="' + F.esc(x.lot) + '" placeholder="批次">' +
          '<input class="inp" data-exp="' + x.line + '" value="' + F.esc(x.expiry || "") +
          '" placeholder="有效期 YYYY-MM-DD"></div></label>';
      }).join("") + "</div>";
      F.dialog("登记收货 · " + v.no, body, '<button class="btn primary" id="rvOk">确认收货</button>');
      document.getElementById("rvOk").addEventListener("click", function () {
        var items = [];
        pending.forEach(function (x) {
          var q = Number(document.querySelector('[data-recv="' + x.line + '"]').value || 0);
          if (q > 0) {
            items.push({ line: x.line, qty: q,
              lot: document.querySelector('[data-lot="' + x.line + '"]').value.trim(),
              expiry: document.querySelector('[data-exp="' + x.line + '"]').value.trim() });
          }
        });
        if (!items.length) { F.toast("请输入收货数量", "err"); return; }
        F.api("POST", "/api/asns/" + v.no + "/receive", { items: items }).then(function () {
          F.toast("收货成功", "ok");
          F.closeDialog(); load(); F.boot();
        }).catch(function (e) { F.toast(e.message, "err"); });
      });
    }

    function doQc(v) {
      var got = (v.items || []).filter(function (x) { return x.receivedQty > 0; });
      var body = '<div class="form-grid">' +
        '<label>质检结论<select id="qcRes"><option>合格</option><option>让步接收</option>' +
        "<option>不合格</option></select></label>" +
        '<label>抽检数量<input id="qcQty" type="number" placeholder="留空按规则 10%"></label>' +
        '<label class="full">说明<input id="qcNote" placeholder="如 外箱轻微破损，让步接收"></label>' +
        "</div><div class='muted small'>将对 " + got.length + " 行已收明细统一判定。</div>";
      F.dialog("来料质检 · " + v.no, body, '<button class="btn primary" id="qcOk">提交判定</button>');
      document.getElementById("qcOk").addEventListener("click", function () {
        var q = Number(document.getElementById("qcQty").value || 0);
        F.api("POST", "/api/asns/" + v.no + "/qc", {
          result: document.getElementById("qcRes").value, qcQty: q || undefined
        }).then(function () {
          F.toast("质检已判定", "ok");
          F.closeDialog(); load(); F.boot();
        }).catch(function (e) { F.toast(e.message, "err"); });
      });
    }

    function doPutawayGen(no) {
      F.api("POST", "/api/asns/" + no + "/putaway", {}).then(function (x) {
        F.toast("已生成 " + x.created + " 条上架任务", "ok");
        F.closeDialog(); load(); F.boot();
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function doPutaway(no) {
      F.api("GET", "/api/locations?limit=400").then(function (loc) {
        var body = '<div class="form-grid">' +
          '<label class="full">目标货位<select id="puLoc">' + (loc.list || []).map(function (l) {
            return '<option value="' + F.esc(l.code) + '">' + F.esc(l.code) + " · " +
              F.esc(l.kind) + " · 余 " + F.cube(l.capacity - l.used) + "</option>";
          }).join("") + "</select></label></div>";
        F.dialog("执行上架 " + no, body, '<button class="btn primary" id="puOk">确认上架</button>');
        document.getElementById("puOk").addEventListener("click", function () {
          F.api("POST", "/api/putaway/" + no + "/done",
            { to: document.getElementById("puLoc").value }).then(function (x) {
            F.toast("上架完成 → " + x.to, "ok");
            F.closeDialog(); load(); F.boot();
          }).catch(function (e) { F.toast(e.message, "err"); });
        });
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function doCancel(no) {
      F.api("POST", "/api/asns/" + no + "/cancel", {}).then(function () {
        F.toast("单据已取消", "ok");
        F.closeDialog(); load(); F.boot();
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    /* ---------------- 新建 ASN ---------------- */
    function newAsn() {
      Promise.all([F.api("GET", "/api/suppliers"), F.api("GET", "/api/items?limit=200")])
        .then(function (res) {
          var sup = res[0].list || [], items = res[1].list || [];
          var body = '<div class="form-grid">' +
            '<label>供应商<select id="asSup">' + sup.map(function (s) {
              return '<option value="' + F.esc(s.code) + '">' + F.esc(s.code) + " " +
                F.esc(s.name) + "</option>";
            }).join("") + "</select></label>" +
            '<label>采购单号<input id="asPo" placeholder="PO2026001"></label>' +
            '<label>预约到货<input id="asDate" type="date" value="' + F.today() + '"></label>' +
            '<label>优先级<select id="asPrio"><option>普通</option><option>加急</option></select></label>' +
            '<label>月台<input id="asDock" placeholder="DH-01"></label>' +
            '<label>备注<input id="asNote" placeholder="选填"></label>' +
            '<label class="full">明细</label></div>' +
            '<div id="asLines">' + lineRow(items) + "</div>" +
            '<div class="form-foot" style="justify-content:flex-start">' +
            '<button class="btn sm" id="asAdd">+ 增加一行</button></div>' +
            '<div class="muted small">批次与有效期留空则按物料保质期自动生成。</div>';
          F.dialogWide("新建到货通知", body, '<button class="btn primary" id="asOk">创建</button>');
          document.getElementById("asAdd").addEventListener("click", function () {
            var box = document.getElementById("asLines");
            box.insertAdjacentHTML("beforeend", lineRow(items));
          });
          document.getElementById("asOk").addEventListener("click", function () {
            var list = [];
            document.querySelectorAll("#asLines .line-row").forEach(function (r) {
              var code = r.querySelector("[data-item]").value;
              var qty = Number(r.querySelector("[data-qty]").value || 0);
              if (code && qty > 0) {
                list.push({ item: code, qty: qty,
                  lot: r.querySelector("[data-lot]").value.trim(),
                  expiry: r.querySelector("[data-exp]").value.trim() });
              }
            });
            if (!list.length) { F.toast("请至少填写一行明细", "err"); return; }
            F.api("POST", "/api/asns", {
              supplier: document.getElementById("asSup").value,
              poNo: document.getElementById("asPo").value.trim(),
              expectDate: document.getElementById("asDate").value,
              priority: document.getElementById("asPrio").value,
              dock: document.getElementById("asDock").value.trim(),
              note: document.getElementById("asNote").value.trim(),
              items: list
            }).then(function (x) {
              F.closeDialog();
              F.toast("已创建 " + x.no + "，共 " + x.lines + " 行", "ok");
              F.go("inbound", { st: "全部", tab: "asn" });
              F.boot();
            }).catch(function (e) { F.toast(e.message, "err"); });
          });
        }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function lineRow(items) {
      return '<div class="line-row row-flex">' +
        '<select class="inp" data-item>' + items.map(function (i) {
          return '<option value="' + F.esc(i.code) + '">' + F.esc(i.code) + " " +
            F.esc(i.name) + "</option>";
        }).join("") + "</select>" +
        '<input class="inp" data-qty type="number" placeholder="数量" style="max-width:100px">' +
        '<input class="inp" data-lot placeholder="批次（可空）">' +
        '<input class="inp" data-exp placeholder="有效期（可空）">' +
        "</div>";
    }

    load();
  });
})(window, document);

</script>
<script>
/* 飞传 WMS · 出库作业与波次拣货 */
(function (window, document) {
  "use strict";
  var F = window.F;

  var SO_ST = ["全部", "已提交", "已分配", "拣货中", "已拣货", "已复核", "已发运", "已签收"];

/* ---------------- 波次 ---------------- */
function loadWaves() {
  Promise.all([
    F.api("GET", "/api/waves?limit=40"),
    F.api("GET", "/api/waves/candidates")
  ]).then(function (res) {
    var d = res[0], cand = res[1];
    var c = d.counts || {};
    var groups = cand.groups || [];
    var html = '<div class="panel"><div class="panel-title">波次拣货' +
      '<span class="panel-actions">' +
      '<select class="inp sm" id="wvRule">' + (cand.rules || []).map(function (r) {
        return '<option value="' + F.esc(r) + '">按' + F.esc(r) + "组波</option>";
      }).join("") + "</select>" +
      '<button class="btn sm primary" id="wvNew">生成波次</button></span></div>' +
      '<div class="panel-body"><div class="kpi-grid four">' +
      '<div class="kpi"><div class="k-label">待拣波次</div><div class="k-value">' +
      ((c["待拣"] || 0) + (c["拣货中"] || 0)) + '</div><div class="k-sub">已完成 ' +
      (c["已完成"] || 0) + " 个</div></div>" +
      '<div class="kpi gold"><div class="k-label">可组波订单</div><div class="k-value">' +
      (cand.orders || []).length + '</div><div class="k-sub">已分配未进波次</div></div>' +
      '<div class="kpi green"><div class="k-label">建议波次数</div><div class="k-value">' +
      groups.length + '</div><div class="k-sub">均衡度 ' +
      F.num(cand.balance, 2) + "（越小越均衡）</div></div>" +
      '<div class="kpi"><div class="k-label">待拣任务</div><div class="k-value">' +
      (F.state.boot ? F.state.boot.kpi.pickPending : "—") +
      '</div><div class="k-sub">行数口径</div></div></div></div></div>';

    html += '<div class="panel"><div class="panel-title">待组波订单' +
      '<span class="panel-actions small muted">选中后生成波次，或直接点「生成波次」由系统按规则组波</span>' +
      "</div><div class='panel-body flush'>" +
      F.table([
        { label: "", render: function (r) {
          return '<input type="checkbox" data-pick="' + F.esc(r.no) + '">';
        } },
        { label: "单号", render: function (r) { return '<span class="mono">' + F.esc(r.no) + "</span>"; } },
        { label: "客户", render: function (r) { return F.esc(r.customerName); } },
        { label: "优先级", render: function (r) { return F.prio(r.priority); } },
        { label: "截单", render: function (r) { return F.esc(r.cutoff); } },
        { label: "承运商", render: function (r) { return F.esc(r.carrier); } },
        { label: "行数", num: true, render: function (r) { return r.lineCount; } },
        { label: "体积", num: true, render: function (r) { return F.cube(r.cube); } }
      ], cand.orders || [], { empty: "没有待组波订单（先做出库分配）" }) + "</div></div>";

    html += '<div class="panel"><div class="panel-title">波次列表</div><div class="panel-body flush">' +
      F.table([
        { label: "波次号", render: function (r) { return '<span class="mono">' + F.esc(r.no) + "</span>"; } },
        { label: "规则 / 承运商", render: function (r) { return F.esc(r.rule) + " · " +
          F.esc(r.carrier); } },
        { label: "订单", num: true, render: function (r) { return r.orderCnt + " 单"; } },
        { label: "行数", num: true, render: function (r) { return r.lineCnt + " 行"; } },
        { label: "体积 / 重量", num: true, render: function (r) {
          return F.cube(r.cube) + " · " + F.num(r.weight, 1) + " kg";
        } },
        { label: "状态", render: function (r) { return F.tag(r.status); } },
        { label: "", render: function (r) {
          if (r.status === "已完成") return '<span class="small muted">' + F.esc(r.doneAt || "") + "</span>";
          if (r.status === "待拣") return '<button class="btn sm primary" data-rel="' + F.esc(r.no) +
            '">下发拣货</button>';
          return '<button class="btn sm primary" data-wpick="' + F.esc(r.no) + '">整波拣货</button>' +
            ' <button class="btn sm" data-wdone="' + F.esc(r.no) + '">完成</button>';
        } }
      ], d.list, { empty: "暂无波次" }) + "</div></div>";

    document.getElementById("view").innerHTML = html;

    document.getElementById("wvNew").addEventListener("click", function () {
      var picked = [];
      document.querySelectorAll("[data-pick]:checked").forEach(function (c) {
        picked.push(c.getAttribute("data-pick"));
      });
      F.api("POST", "/api/waves", { rule: document.getElementById("wvRule").value,
        orders: picked }).then(function (x) {
        F.toast("已生成 " + x.created + " 个波次", "ok");
        loadWaves(); F.boot();
      }).catch(function (e) { F.toast(e.message, "err"); });
    });
    document.querySelectorAll("[data-rel]").forEach(function (b) {
      b.addEventListener("click", function () {
        F.api("POST", "/api/waves/" + b.getAttribute("data-rel") + "/release", {})
          .then(function () { F.toast("波次已下发，开始拣货", "ok"); loadWaves(); })
          .catch(function (e) { F.toast(e.message, "err"); });
      });
    });
    document.querySelectorAll("[data-wpick]").forEach(function (b) {
      b.addEventListener("click", function () {
        F.api("POST", "/api/waves/" + b.getAttribute("data-wpick") + "/pick", {})
          .then(function (x) {
            F.toast("整波拣货完成 " + x.lines + " 行" + (x.short.length ?
              "，短拣 " + x.short.length + " 行" : ""), x.short.length ? "err" : "ok");
            loadWaves(); F.boot();
          }).catch(function (e) { F.toast(e.message, "err"); });
      });
    });
    document.querySelectorAll("[data-wdone]").forEach(function (b) {
      b.addEventListener("click", function () {
        F.api("POST", "/api/waves/" + b.getAttribute("data-wdone") + "/done", {})
          .then(function () { F.toast("波次已完成", "ok"); loadWaves(); F.boot(); })
          .catch(function (e) { F.toast(e.message, "err"); });
      });
    });

    F.setSide('<div class="side-block"><div class="hd">组波说明</div><div class="bd small muted" ' +
      'style="line-height:1.9">波次把多张已分配订单合并成一次拣货任务，按承运商 / 截单时段 / ' +
      '客户 / 库区聚类，单波上限 12 单、120 行；拣货任务按货位蛇形排序，减少回头路。</div></div>');
    F.setStatus("波次拣货 · " + (d.total || 0) + " 个波次");
  }).catch(function (e) { F.toast(e.message, "err"); });
}



  F.register("outbound", function (params) {
    var st = params.st || "全部";
    var tab = params.tab || "orders";

    function load() {
      if (tab === "waves") return loadWaves();
      var q = st === "全部" ? "" : "&status=" + encodeURIComponent(st);
      Promise.all([
        F.api("GET", "/api/orders?limit=80" + q),
        F.api("GET", "/api/waves?limit=40")
      ]).then(function (res) {
        var d = res[0], w = res[1];
        var c = d.counts || {};
        var pendingShip = (w.list || []).filter(function (x) { return x.status !== "已完成"; }).length;
        var html = '<div class="panel"><div class="panel-title">出库作业' +
          '<span class="panel-actions">' +
          '<button class="btn sm" id="soNew">新建出库单</button>' +
          '<button class="btn sm" id="soRefresh">刷新</button></span></div>' +
          '<div class="panel-body"><div class="kpi-grid four">' +
          '<div class="kpi"><div class="k-label">待分配</div><div class="k-value">' +
          ((c["已提交"] || 0) + (c["草稿"] || 0)) +
          '</div><div class="k-sub">已提交 ' + (c["已提交"] || 0) + " · 草稿 " +
          (c["草稿"] || 0) + "</div></div>" +
          '<div class="kpi gold"><div class="k-label">拣货在途</div><div class="k-value">' +
          ((c["已分配"] || 0) + (c["拣货中"] || 0)) +
          '</div><div class="k-sub">已拣货 ' + (c["已拣货"] || 0) + " 单</div></div>" +
          '<div class="kpi green"><div class="k-label">待发运</div><div class="k-value">' +
          (c["已复核"] || 0) + '</div><div class="k-sub">在途波次 ' + pendingShip + " 个</div></div>" +
          '<div class="kpi"><div class="k-label">已发运 / 签收</div><div class="k-value">' +
          ((c["已发运"] || 0) + (c["已签收"] || 0)) +
          '</div><div class="k-sub">单据合计 ' + d.total + " 单</div></div></div>" +
          F.chips([["orders", "出库单 (" + d.total + ")"], ["waves", "波次 (" +
            (w.total || 0) + ")"]], tab, "data-tab") + "</div></div>";

        html += '<div class="panel"><div class="panel-title">出库单' +
          F.chips(SO_ST.map(function (x) {
            return [x, x, x === "全部" ? d.total : (c[x] || 0)];
          }), st, "data-st") + "</div><div class='panel-body flush' id='soBody'></div></div>";
        document.getElementById("view").innerHTML = html;

        document.getElementById("soBody").innerHTML = F.table([
          { label: "单号", render: function (r) { return '<span class="mono">' + F.esc(r.no) + "</span>"; } },
          { label: "客户", render: function (r) { return F.esc(r.customerName) +
            '<div class="muted small">' + F.esc(r.dest || "") + "</div>"; } },
          { label: "优先级", render: function (r) { return F.prio(r.priority) +
            ' <span class="muted small">' + F.esc(r.cutoff) + " 截单</span>"; } },
          { label: "行 / 量", num: true, render: function (r) {
            return r.lineCount + " 行 · " + F.qty(r.qty);
          } },
          { label: "满足率", render: function (r) {
            return '<div class="util-cell">' + F.progress(r.fillRate || r.progress) +
              '<span class="small">' + F.pct(r.fillRate || 0, 0) + "</span></div>";
          } },
          { label: "承运", render: function (r) { return '<span class="small">' +
            F.esc(r.carrier) + "</span>"; } },
          { label: "状态", render: function (r) { return F.tag(r.status); } },
          { label: "波次", render: function (r) { return r.waveNo ?
            '<span class="mono small">' + F.esc(r.waveNo.slice(-4)) + "</span>" : "—"; } }
        ], d.list, { click: function (r) { return r.no; }, empty: "该状态下没有单据" });
        F.bindRows(document, openOrder);

        document.querySelectorAll("[data-st]").forEach(function (b) {
          b.addEventListener("click", function () {
            F.go("outbound", { st: b.getAttribute("data-st"), tab: "orders" });
          });
        });
        document.querySelectorAll("[data-tab]").forEach(function (b) {
          b.addEventListener("click", function () {
            if (b.getAttribute("data-tab") === "waves") return F.go("wave");
            F.go("outbound", { st: st, tab: "orders" });
          });
        });
        document.getElementById("soNew").addEventListener("click", newOrder);
        document.getElementById("soRefresh").addEventListener("click", function () {
          F.go("outbound", { st: st, tab: "orders" });
        });

        F.setSide('<div class="side-block"><div class="hd">出库流程</div><div class="bd small" ' +
          'style="line-height:2">已提交 → 已分配 → 拣货中 → 已拣货 → 已复核 → 已发运 → 已签收' +
          '<div class="muted" style="margin-top:8px">· 分配按 FEFO（先到期先出）锁定库存<br>' +
          '· 拣货确认即扣减库存并写流水<br>· 复核打包生成包裹与运单号</div></div></div>');
        F.setStatus("出库作业 · " + d.total + " 张出库单");
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    /* ---------------- 订单详情 ---------------- */
    function openOrder(no) {
      F.api("GET", "/api/orders/" + no).then(function (v) {
        var ctx = v.gate.ctx;
        var html = '<div class="kpi-grid four">' +
          '<div class="kpi"><div class="k-label">订单数量</div><div class="k-value">' +
          F.qty(v.qty) + '</div><div class="k-sub">' + v.lineCount + " 行 · " +
          F.wan(v.amount) + " 元</div></div>" +
          '<div class="kpi green"><div class="k-label">已分配</div><div class="k-value">' +
          F.qty(v.allocatedQty) + '</div><div class="k-sub">满足率 ' + F.pct(v.fillRate, 1) +
          "</div></div>" +
          '<div class="kpi gold"><div class="k-label">已拣货</div><div class="k-value">' +
          F.qty(v.pickedQty) + '</div><div class="k-sub">进度 ' + F.pct(v.progress, 0) + "</div></div>" +
          '<div class="kpi"><div class="k-label">重量 / 体积</div><div class="k-value">' +
          F.num(v.weight, 1) + " kg</div><div class=\"k-sub\">" + F.cube(v.cube) + "</div></div></div>";

        html += '<div class="kv-grid">' +
          F.kv("客户", F.esc(v.customerName) + ' <span class="muted small">' +
            F.esc(v.customerLevel) + "</span>") +
          F.kv("承运商", F.esc(v.carrier) + " · " + F.esc(v.cutoff) + " 截单") +
          F.kv("优先级", F.prio(v.priority)) +
          F.kv("状态", F.tag(v.status)) +
          F.kv("波次", F.esc(v.waveNo || "—")) +
          F.kv("运单号", F.esc(v.trackingNo || "—")) +
          F.kv("创建", F.esc(v.createdAt)) +
          F.kv("发运", F.esc(v.shippedAt || "—")) + "</div>";

        html += '<div class="gate-box"><div class="gate-hd">状态闸口</div>' +
          (v.gate.gates || []).map(function (g) {
            return '<div class="gate ' + (g.ok ? "ok" : "bad") + '"><b>' +
              (g.ok ? "✓" : "✕") + " " + F.esc(g.target) + "</b>" +
              (g.ok ? '<span class="muted small">可以推进</span>' :
                "<span>" + g.missing.map(F.esc).join("；") + "</span>") + "</div>";
          }).join("") + "</div>";

        html += '<div class="sub-title">出库明细</div>' + F.table([
          { label: "#", render: function (r) { return r.line; } },
          { label: "物料", render: function (r) { return F.esc(r.item) +
            '<div class="muted small">' + F.esc(r.name) + "</div>"; } },
          { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
          { label: "已分配", num: true, render: function (r) { return F.qty(r.allocatedQty); } },
          { label: "已拣", num: true, render: function (r) { return F.qty(r.pickedQty); } },
          { label: "批次", render: function (r) { return '<span class="mono small">' + F.esc(r.lot || "—") + "</span>"; } },
          { label: "货位", render: function (r) { return '<span class="mono small">' + F.esc(r.location || "—") + "</span>"; } },
          { label: "金额", num: true, render: function (r) { return F.num(r.qty * r.price, 0); } }
        ], v.items);

        if ((v.allocations || []).length) {
          html += '<div class="sub-title">分配明细（' + v.allocations.length + ' 条）</div>' + F.table([
            { label: "物料", render: function (r) { return F.esc(r.item); } },
            { label: "批次", render: function (r) { return '<span class="mono small">' + F.esc(r.lot) + "</span>"; } },
            { label: "货位", render: function (r) { return '<span class="mono small">' + F.esc(r.location) + "</span>"; } },
            { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
            { label: "状态", render: function (r) { return F.tag(r.status); } }
          ], v.allocations.slice(0, 12));
        }

        if ((v.picks || []).length) {
          html += '<div class="sub-title">拣货任务（按货位蛇形排序 · 行走 ' +
            F.num(v.pathDistance, 0) + " 米 · 预计 " + F.num(v.pickMinutes, 1) + " 分钟）</div>" +
            F.table([
              { label: "序", render: function (r) { return "P" + (r.seq < 10 ? "0" : "") + r.seq; } },
              { label: "任务号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
              { label: "货位", render: function (r) { return '<span class="mono">' + F.esc(r.from_loc) + "</span>"; } },
              { label: "物料", render: function (r) { return F.esc(r.item) +
                '<div class="muted small">' + F.esc(r.name) + "</div>"; } },
              { label: "批次", render: function (r) { return '<span class="mono small">' + F.esc(r.lot) + "</span>"; } },
              { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
              { label: "状态", render: function (r) { return F.tag(r.status); } }
            ], v.picks);
        }

        if ((v.packages || []).length) {
          html += '<div class="sub-title">包裹与运单</div>' + F.table([
            { label: "包裹号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
            { label: "箱数", num: true, render: function (r) { return r.boxes; } },
            { label: "重量", num: true, render: function (r) { return F.num(r.weight, 1) + " kg"; } },
            { label: "体积", num: true, render: function (r) { return F.cube(r.cube); } },
            { label: "运单号", render: function (r) { return F.esc(r.tracking_no || "—"); } },
            { label: "状态", render: function (r) { return F.tag(r.status); } }
          ], v.packages);
        }

        var btns = [];
        if (v.status === "草稿") btns.push(["stage:已提交", "提交订单", "primary"]);
        if (v.status === "已提交" || v.status === "已分配") btns.push(["alloc", "库存分配", "primary"]);
        if (v.status === "已分配" || v.status === "拣货中") btns.push(["pick", "拣货确认", "primary"]);
        if (v.status === "已拣货") btns.push(["pack", "复核打包", "primary"]);
        if (v.status === "已复核") btns.push(["ship", "发运出库", "primary"]);
        if (v.status === "已发运") btns.push(["stage:已签收", "登记签收", "primary"]);
        btns.push(["picklist", "拣货单", ""]);
        if (v.gate.cancelable) btns.push(["cancel", "取消订单", "danger"]);
        var foot = btns.map(function (b) {
          return '<button class="btn ' + b[2] + '" data-act="' + b[0] + '">' + b[1] + "</button>";
        }).join("") + '<button class="btn" data-close-foot="1">关闭</button>';

        var dlg = F.dialogWide("出库单 " + v.no + " · " + v.status, html, foot);
        dlg.querySelector("[data-close-foot]").addEventListener("click", F.closeDialog);
        dlg.querySelectorAll("[data-act]").forEach(function (b) {
          b.addEventListener("click", function () {
            var act = b.getAttribute("data-act");
            if (act.indexOf("stage:") === 0) return doStage(v.no, act.slice(6));
            if (act === "alloc") return doAlloc(v.no);
            if (act === "pick") return doPick(v.no);
            if (act === "pack") return doPack(v);
            if (act === "ship") return doShip(v);
            if (act === "picklist") return showPicklist(v.no);
            if (act === "cancel") return doCancel(v.no);
          });
        });
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function doStage(no, target) {
      F.api("POST", "/api/orders/" + no + "/stage", { target: target }).then(function () {
        F.toast("已推进到「" + target + "」", "ok");
        F.closeDialog(); load(); F.boot();
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function doAlloc(no) {
      F.api("POST", "/api/orders/" + no + "/alloc", {}).then(function (x) {
        if (x.short && x.short.length) {
          F.toast("分配完成，满足率 " + F.pct(x.fillRate, 0) + "，缺量 " + x.short.length + " 行", "err");
        } else {
          F.toast("分配完成，满足率 " + F.pct(x.fillRate, 0) + "（" + x.strategy + "）", "ok");
        }
        F.closeDialog(); load(); F.boot();
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function doPick(no) {
      F.api("POST", "/api/orders/" + no + "/pick", {}).then(function (x) {
        F.toast("拣货完成 " + x.lines + " 行，共 " + F.qty(x.qty) + " 件", "ok");
        F.closeDialog(); load(); F.boot();
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function doPack(v) {
      var body = '<div class="form-grid">' +
        '<label>箱数<input id="pkBoxes" type="number" placeholder="留空自动估算"></label>' +
        "</div><div class='muted small'>重量 " + F.num(v.weight, 1) + " kg · 体积 " +
        F.cube(v.cube) + "，系统按 18kg/箱与体积双约束估算箱数。</div>";
      F.dialog("复核打包 · " + v.no, body, '<button class="btn primary" id="pkOk">确认打包</button>');
      document.getElementById("pkOk").addEventListener("click", function () {
        var n = Number(document.getElementById("pkBoxes").value || 0);
        F.api("POST", "/api/orders/" + v.no + "/pack", { boxes: n || undefined }).then(function (x) {
          F.toast("打包完成：" + x.boxes + " 箱 / " + F.num(x.weight, 1) + " kg", "ok");
          F.closeDialog(); load(); F.boot();
        }).catch(function (e) { F.toast(e.message, "err"); });
      });
    }

    function doShip(v) {
      F.api("GET", "/api/carriers").then(function (c) {
        var body = '<div class="form-grid">' +
          '<label>承运商<select id="shCar">' + (c.list || []).map(function (x) {
            return '<option value="' + F.esc(x.code) + '"' + (x.code === v.carrier ? " selected" : "") +
              ">" + F.esc(x.name) + "（" + F.esc(x.cutoff) + " 截单）</option>";
          }).join("") + "</select></label>" +
          '<label>运单号<input id="shTrack" placeholder="留空自动生成"></label></div>';
        F.dialog("发运出库 · " + v.no, body, '<button class="btn primary" id="shOk">确认发运</button>');
        document.getElementById("shOk").addEventListener("click", function () {
          F.api("POST", "/api/orders/" + v.no + "/ship", {
            carrier: document.getElementById("shCar").value,
            trackingNo: document.getElementById("shTrack").value.trim()
          }).then(function (x) {
            F.toast("已发运，运单号 " + x.trackingNo, "ok");
            F.closeDialog(); load(); F.boot();
          }).catch(function (e) { F.toast(e.message, "err"); });
        });
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function showPicklist(no) {
      F.api("GET", "/api/orders/" + no + "/picklist").then(function (v) {
        var html = '<div class="kv-grid">' +
          F.kv("出库单", F.esc(v.no)) + F.kv("客户", F.esc(v.customer)) +
          F.kv("承运商", F.esc(v.carrier)) + F.kv("优先级", F.prio(v.priority)) +
          F.kv("行走距离", F.num(v.distance, 0) + " 米") +
          F.kv("预计工时", F.num(v.minutes, 1) + " 分钟") + "</div>" +
          '<div class="sub-title">拣货路径（蛇形排序）</div>' +
          F.table([
            { label: "序", render: function (r, i) { return "P" + ((i + 1) < 10 ? "0" : "") + (i + 1); } },
            { label: "货位", render: function (r) { return '<span class="mono">' + F.esc(r.from_loc) + "</span>"; } },
            { label: "物料", render: function (r) { return F.esc(r.item) + " " +
              '<span class="muted small">' + F.esc(r.name || "") + "</span>"; } },
            { label: "批次", render: function (r) { return '<span class="mono small">' + F.esc(r.lot) + "</span>"; } },
            { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } }
          ], v.lines) +
          '<div class="muted small" style="margin-top:8px">路径：' + (v.path || []).join(" → ") + "</div>";
        F.dialogWide("拣货单 " + v.no, html, '<button class="btn" onclick="window.print()">打印</button>');
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function doCancel(no) {
      F.api("POST", "/api/orders/" + no + "/cancel", {}).then(function () {
        F.toast("订单已取消，锁定库存已释放", "ok");
        F.closeDialog(); load(); F.boot();
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    /* ---------------- 新建出库单 ---------------- */
    function newOrder() {
      Promise.all([F.api("GET", "/api/customers"), F.api("GET", "/api/items?limit=200")])
        .then(function (res) {
          var cust = res[0].list || [], items = res[1].list || [];
          var body = '<div class="form-grid">' +
            '<label>客户<select id="soCust">' + cust.map(function (c) {
              return '<option value="' + F.esc(c.code) + '">' + F.esc(c.code) + " " +
                F.esc(c.name) + "（" + F.esc(c.level) + "）</option>";
            }).join("") + "</select></label>" +
            '<label>优先级<select id="soPrio"><option>普通</option><option>加急</option>' +
            "<option>特急</option></select></label>" +
            '<label>截单时间<input id="soCut" type="time" value="18:00"></label>' +
            '<label>收货地址<input id="soDest" placeholder="选填"></label>' +
            '<label class="full">明细</label></div>' +
            '<div id="soLines">' + soLine(items) + "</div>" +
            '<div class="form-foot" style="justify-content:flex-start">' +
            '<button class="btn sm" id="soAdd">+ 增加一行</button></div>' +
            '<div class="muted small">提交后可在详情里做库存分配（FEFO）。</div>';
          F.dialogWide("新建出库单", body, '<button class="btn primary" id="soOk">创建</button>');
          document.getElementById("soAdd").addEventListener("click", function () {
            document.getElementById("soLines").insertAdjacentHTML("beforeend", soLine(items));
          });
          document.getElementById("soOk").addEventListener("click", function () {
            var list = [];
            document.querySelectorAll("#soLines .line-row").forEach(function (r) {
              var code = r.querySelector("[data-item]").value;
              var q = Number(r.querySelector("[data-qty]").value || 0);
              if (code && q > 0) list.push({ item: code, qty: q });
            });
            if (!list.length) { F.toast("请至少填写一行明细", "err"); return; }
            F.api("POST", "/api/orders", {
              customer: document.getElementById("soCust").value,
              priority: document.getElementById("soPrio").value,
              cutoff: document.getElementById("soCut").value,
              dest: document.getElementById("soDest").value.trim(),
              items: list
            }).then(function (x) {
              F.closeDialog();
              F.toast("已创建 " + x.no + "，共 " + x.lines + " 行", "ok");
              F.go("outbound", { st: "全部", tab: "orders" });
              F.boot();
            }).catch(function (e) { F.toast(e.message, "err"); });
          });
        }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function soLine(items) {
      return '<div class="line-row row-flex">' +
        '<select class="inp" data-item>' + items.map(function (i) {
          return '<option value="' + F.esc(i.code) + '">' + F.esc(i.code) + " " + F.esc(i.name) +
            "（库存 " + F.qty(i.stockQty) + "）</option>";
        }).join("") + "</select>" +
        '<input class="inp" data-qty type="number" placeholder="数量" style="max-width:110px">' +
        "</div>";
    }

    load();
  });

  /* 波次拣货独立页面 */
  F.register("wave", function () { loadWaves(); });
})(window, document);

</script>
<script>
/* 飞传 WMS · 库存台账、库位管理、补货与移库 */
(function (window, document) {
  "use strict";
  var F = window.F;

  /* ============================================================ 库存台账 */
  F.register("stock", function (params) {
    var tab = params.tab || "detail";
    var only = params.only || "";
    var q = params.q || "";

    function load() {
      var qs = "?limit=200" + (only ? "&only=" + only : "") +
        (q ? "&q=" + encodeURIComponent(q) : "");
      Promise.all([
        tab === "detail" ? F.api("GET", "/api/stock" + qs)
          : F.api("GET", "/api/stock/summary" + (q ? "?q=" + encodeURIComponent(q) : "")),
        F.api("GET", "/api/expiry?days=30")
      ]).then(function (res) {
        var d = res[0], ex = res[1];
        var s = d.summary || { qty: 0, value: 0, sku: 0, lots: 0, locs: 0, allocated: 0 };
        var html = '<div class="panel"><div class="panel-title">库存台账' +
          '<span class="panel-actions">' +
          '<input class="inp sm" id="stQ" placeholder="物料/批次/货位" value="' + F.esc(q) + '">' +
          '<button class="btn sm" id="stGo">查询</button>' +
          '<a class="btn sm" href="api/export/stock.csv" target="_blank">导出 CSV</a>' +
          "</span></div><div class=\"panel-body\"><div class=\"kpi-grid four\">" +
          '<div class="kpi"><div class="k-label">在库数量</div><div class="k-value">' +
          F.wan(s.qty) + '</div><div class="k-sub">锁定 ' + F.qty(s.allocated) + " 件</div></div>" +
          '<div class="kpi green"><div class="k-label">库存货值</div><div class="k-value">' +
          F.wan(s.value) + '</div><div class="k-sub">' + s.sku + " 个 SKU · " + s.lots +
          " 个批次</div></div>" +
          '<div class="kpi"><div class="k-label">占用货位</div><div class="k-value">' + s.locs +
          '</div><div class="k-sub">平均 ' + F.qty(s.locs ? s.qty / s.locs : 0) + " 件/货位</div></div>" +
          '<div class="kpi gold"><div class="k-label">30 天临期</div><div class="k-value">' +
          ex.total + '</div><div class="k-sub">数量 ' + F.qty(ex.qty) + " · 货值 " +
          F.wan(ex.amount) + "</div></div></div>" +
          F.chips([["detail", "批次明细 (" + (tab === "detail" ? d.total : "…") + ")"],
            ["summary", "按物料汇总"]], tab, "data-tab") +
          (tab === "detail" ? F.chips([["", "全部"], ["available", "仅可用"], ["expiry", "临期 30 天"]],
            only, "data-only") : "") +
          "</div></div>";

        html += '<div class="panel"><div class="panel-title">' +
          (tab === "detail" ? "库存明细（批次 + 货位）" : "按物料汇总") +
          '<span class="panel-actions small muted">' +
          (tab === "detail" ? "点击行查看批次追溯" : "按库存金额降序") + "</span></div>" +
          "<div class='panel-body flush' id='stBody'></div></div>";
        document.getElementById("view").innerHTML = html;

        var body = document.getElementById("stBody");
        if (tab === "detail") {
          body.innerHTML = F.table([
            { label: "物料", render: function (r) { return F.tag(r.abc, r.abc === "A" ? "green" :
              (r.abc === "B" ? "blue" : "gold")) + ' <b class="small">' + F.esc(r.item) + "</b>" +
              '<div class="muted small">' + F.esc(r.name) + "</div>"; } },
            { label: "批次", render: function (r) { return '<span class="mono small">' + F.esc(r.lot) + "</span>"; } },
            { label: "货位", render: function (r) { return '<span class="mono">' + F.esc(r.location) + "</span>"; } },
            { label: "数量", num: true, render: function (r) { return '<b>' + F.qty(r.qty) + "</b> " +
              '<span class="muted small">' + F.esc(r.unit) + "</span>"; } },
            { label: "锁定", num: true, render: function (r) { return r.allocated ? F.qty(r.allocated) : "—"; } },
            { label: "可用", num: true, render: function (r) { return F.qty(r.avail); } },
            { label: "金额", num: true, render: function (r) { return F.wan(r.amount); } },
            { label: "有效期", render: function (r) {
              if (!r.expiry) return '<span class="muted small">—</span>';
              return '<span class="small">' + F.esc(r.expiry) + "</span><div>" +
                F.tag(r.daysLeft + " 天", r.expiryLevel === "已过期" ? "red" :
                  (r.expiryLevel === "临期" ? "gold" : "gray")) + "</div>";
            } },
            { label: "状态", render: function (r) { return F.tag(r.status); } }
          ], d.list, { click: function (r) { return r.lot; }, empty: "没有匹配的库存" });
          F.bindRows(document, function (lot) { F.go("trace", { lot: lot }); });
        } else {
          body.innerHTML = F.table([
            { label: "物料", render: function (r) { return F.tag(r.abc, r.abc === "A" ? "green" :
              (r.abc === "B" ? "blue" : "gold")) + ' <b class="small">' + F.esc(r.item) + "</b>" +
              '<div class="muted small">' + F.esc(r.name) + " · " + F.esc(r.category) + "</div>"; } },
            { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
            { label: "锁定", num: true, render: function (r) { return r.allocated ? F.qty(r.allocated) : "—"; } },
            { label: "货值", num: true, render: function (r) { return F.wan(r.amount); } },
            { label: "批次/货位", num: true, render: function (r) {
              return r.lotCount + " / " + r.locCount;
            } },
            { label: "水位", render: function (r) { return F.tag(r.level) +
              '<div class="muted small">安全 ' + F.qty(r.safety) + "</div>"; } },
            { label: "最近效期", render: function (r) { return r.expiry ?
              '<span class="small">' + F.esc(r.expiry) + '</span><div class="muted small">剩 ' +
              (r.daysLeft === null ? "—" : r.daysLeft + " 天") + "</div>" :
              '<span class="muted small">—</span>'; } },
            { label: "", render: function (r) { return '<a class="btn sm" href="#items">详情</a>'; } }
          ], d.list, { empty: "没有匹配的物料" });
        }

        document.querySelectorAll("[data-tab]").forEach(function (b) {
          b.addEventListener("click", function () {
            F.go("stock", { tab: b.getAttribute("data-tab"), q: q, only: only });
          });
        });
        document.querySelectorAll("[data-only]").forEach(function (b) {
          b.addEventListener("click", function () {
            F.go("stock", { tab: "detail", only: b.getAttribute("data-only"), q: q });
          });
        });
        document.getElementById("stGo").addEventListener("click", function () {
          F.go("stock", { tab: tab, only: only, q: document.getElementById("stQ").value.trim() });
        });

        F.setSide('<div class="side-block"><div class="hd">库存口径</div><div class="bd small" ' +
          'style="line-height:1.9">可用量 = 现有量 − 已锁定 − 冻结量。批次按有效期升序排列，' +
          '分配默认 FEFO（先到期先出），可在基础设置里切换 FIFO / LIFO。</div></div>' +
          '<div class="side-block"><div class="hd">临期分布</div><div class="bd">' +
          F.kv("已过期批次", ex.buckets["已过期"] || 0) +
          F.kv("临期（≤30 天）", ex.buckets["临期"] || 0) +
          F.kv("关注（≤90 天）", ex.buckets["关注"] || 0) +
          "</div></div>");
        F.setStatus("库存台账 · " + (d.total || 0) + " 条记录");
      }).catch(function (e) { F.toast(e.message, "err"); });
    }
    load();
  });

  /* ============================================================ 库位管理 */
  F.register("locations", function (params) {
    var zone = params.zone || "";

    function load() {
      Promise.all([
        F.api("GET", "/api/locations?limit=400"),
        F.api("GET", "/api/zones")
      ]).then(function (res) {
        var d = res[0], z = res[1];
        var list = d.list || [];
        var zones = z.list || [];
        var shown = zone ? list.filter(function (x) { return x.zone === zone; }) : list;
        var busy = list.filter(function (x) { return x.used > 0; }).length;
        var cap = list.reduce(function (a, x) { return a + x.capacity; }, 0);
        var used = list.reduce(function (a, x) { return a + x.used; }, 0);

        var html = '<div class="panel"><div class="panel-title">库位管理' +
          '<span class="panel-actions small muted">共 ' + list.length + " 个货位</span></div>" +
          '<div class="panel-body"><div class="kpi-grid four">' +
          '<div class="kpi"><div class="k-label">货位总数</div><div class="k-value">' + list.length +
          '</div><div class="k-sub">占用 ' + busy + " · 空闲 " + (list.length - busy) + "</div></div>" +
          '<div class="kpi green"><div class="k-label">货位占用率</div><div class="k-value">' +
          F.pct(busy / Math.max(1, list.length), 0) + '</div><div class="k-sub">有货货位占比</div></div>' +
          '<div class="kpi"><div class="k-label">总容量</div><div class="k-value">' + F.cube(cap) +
          '</div><div class="k-sub">已用 ' + F.cube(used) + "</div></div>" +
          '<div class="kpi gold"><div class="k-label">体积利用率</div><div class="k-value">' +
          F.pct(used / Math.max(0.001, cap), 1) + '</div><div class="k-sub">超过 90% 建议调整</div></div>' +
          "</div>" + F.chips([["", "全部库区"]].concat(zones.map(function (x) {
            return [x.code, x.code + " " + x.kind, x.locCount];
          })), zone, "data-zone") + "</div></div>";

        html += '<div class="panel"><div class="panel-title">库区负荷' +
          '<span class="panel-actions small muted">颜色越深占用越高</span></div>' +
          '<div class="panel-body"><div class="zone-cards">' +
          zones.map(function (x) {
            return '<div class="zone-card' + (x.code === zone ? " on" : "") + '" data-z="' + F.esc(x.code) + '">' +
              '<div class="zc-hd"><b>' + F.esc(x.code) + "</b><span>" + F.esc(x.kind) + "</span></div>" +
              '<div class="zc-name">' + F.esc(x.name) + "</div>" +
              F.progress(x.util) +
              '<div class="zc-ft"><span>' + F.pct(x.util, 0) + " 体积</span><span>" +
              F.qty(x.stockQty) + " 件</span><span>" + x.locCount + " 位</span></div></div>";
          }).join("") + "</div>";
        html += '<div class="loc-legend"><span><i class="lv0"></i>空闲</span>' +
          '<span><i class="lv1"></i>&lt;30%</span><span><i class="lv2"></i>30~70%</span>' +
          '<span><i class="lv3"></i>70~90%</span><span><i class="lv4"></i>&gt;90%</span></div>';
        html += '<div class="loc-grid">' + shown.map(function (x) {
          var lv = x.used <= 0 ? 0 : (x.util < 0.3 ? 1 : (x.util < 0.7 ? 2 : (x.util < 0.9 ? 3 : 4)));
          return '<div class="loc-cell lv' + lv + '" data-loc="' + F.esc(x.code) + '" title="' +
            F.esc(x.code) + " · " + F.esc(x.kind) + " · 使用 " + F.pct(x.util, 0) + '">' +
            '<b>' + F.esc(x.code.split("-").slice(1).join("-")) + "</b>" +
            '<span>' + F.qty(x.stockQty) + "</span></div>";
        }).join("") + "</div></div></div>";

        html += '<div class="panel"><div class="panel-title">货位明细</div>' +
          "<div class='panel-body flush'>" + F.table([
            { label: "货位", render: function (r) { return '<span class="mono">' + F.esc(r.code) + "</span>"; } },
            { label: "库区", render: function (r) { return F.esc(r.zone); } },
            { label: "类型", render: function (r) { return F.tag(r.kind, "gray"); } },
            { label: "排-列-层", render: function (r) {
              return '<span class="mono small">' + r.aisle + "-" + r.col + "-" + r.level + "</span>";
            } },
            { label: "SKU / 数量", num: true, render: function (r) {
              return r.skuCount + " / " + F.qty(r.stockQty);
            } },
            { label: "容量", num: true, render: function (r) {
              return F.cube(r.used) + " / " + F.cube(r.capacity);
            } },
            { label: "利用率", render: function (r) {
              return '<div class="util-cell">' + F.progress(r.util) + '<span class="small">' +
                F.pct(r.util, 0) + "</span></div>";
            } },
            { label: "状态", render: function (r) { return F.tag(r.status); } }
          ], shown, { click: function (r) { return r.code; }, empty: "该库区暂无货位" }) +
          "</div></div>";
        document.getElementById("view").innerHTML = html;

        document.querySelectorAll("[data-zone]").forEach(function (b) {
          b.addEventListener("click", function () {
            F.go("locations", { zone: b.getAttribute("data-zone") });
          });
        });
        document.querySelectorAll("[data-z]").forEach(function (b) {
          b.addEventListener("click", function () {
            F.go("locations", { zone: b.getAttribute("data-z") });
          });
        });
        F.bindRows(document, function (code) { showLoc(code, list); });
        document.querySelectorAll("[data-loc]").forEach(function (c) {
          c.addEventListener("click", function () { showLoc(c.getAttribute("data-loc"), list); });
        });

        F.setSide('<div class="side-block"><div class="hd">货位编码规则</div><div class="bd small" ' +
          'style="line-height:1.9">区-排-列-层，例如 <span class="mono">A-01-02-3</span>：A 区 1 排 ' +
          '2 列第 3 层。拣货按区 → 排 → 列（奇偶反向）→ 低层优先的蛇形顺序，减少行走距离。</div></div>');
        F.setStatus("库位管理 · " + list.length + " 个货位");
      }).catch(function (e) { F.toast(e.message, "err"); });
    }

    function showLoc(code, list) {
      var l = (list || []).filter(function (x) { return x.code === code; })[0] || {};
      F.api("GET", "/api/stock?location=" + encodeURIComponent(code)).then(function (d) {
        var html = '<div class="kv-grid">' +
          F.kv("货位", '<span class="mono">' + F.esc(code) + "</span>") +
          F.kv("类型", F.esc(l.kind || "")) +
          F.kv("容量", F.cube(l.capacity || 0)) +
          F.kv("已用", F.cube(l.used || 0) + "（" + F.pct(l.util || 0, 0) + "）") +
          F.kv("SKU 数", (d.summary || {}).sku || 0) +
          F.kv("状态", F.tag(l.status || "空闲")) + "</div>" +
          (d.list && d.list.length ? F.table([
            { label: "物料", render: function (r) { return F.esc(r.item) + " " +
              '<span class="muted small">' + F.esc(r.name) + "</span>"; } },
            { label: "批次", render: function (r) { return '<span class="mono small">' + F.esc(r.lot) + "</span>"; } },
            { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
            { label: "可用", num: true, render: function (r) { return F.qty(r.avail); } },
            { label: "有效期", render: function (r) { return F.esc(r.expiry || "—"); } }
          ], d.list) : F.empty("该货位为空"));
        F.dialog("货位 " + code, html, '<button class="btn" data-close-foot="1">关闭</button>');
        document.querySelector("[data-close-foot]").addEventListener("click", F.closeDialog);
      }).catch(function (e) { F.toast(e.message, "err"); });
    }
    load();
  });

  /* ============================================================ 补货与移库 */
  F.register("replenish", function () {
    function load() {
      Promise.all([
        F.api("GET", "/api/replenish"),
        F.api("GET", "/api/transfers")
      ]).then(function (res) {
        var d = res[0], t = res[1];
        var sug = d.suggestions || [];
        var tasks = d.tasks || [];
        var html = '<div class="panel"><div class="panel-title">补货与移库' +
          '<span class="panel-actions small muted">拣货面下限 ' + d.min + " 件 / 上限 " +
          d.max + " 件</span></div><div class=\"panel-body\"><div class=\"kpi-grid four\">" +
          '<div class="kpi"><div class="k-label">补货建议</div><div class="k-value">' + sug.length +
          '</div><div class="k-sub">缺货 ' + sug.filter(function (x) { return x.urgent; }).length +
          " 个拣货面</div></div>" +
          '<div class="kpi gold"><div class="k-label">待执行任务</div><div class="k-value">' +
          tasks.filter(function (x) { return x.status === "待执行"; }).length +
          '</div><div class="k-sub">已完成 ' + tasks.filter(function (x) {
            return x.status === "已完成";
          }).length + "</div></div>" +
          '<div class="kpi green"><div class="k-label">移库记录</div><div class="k-value">' +
          (t.list || []).length + '</div><div class="k-sub">库内调拨</div></div>' +
          '<div class="kpi"><div class="k-label">补货策略</div><div class="k-value">' +
          (d.min > 0 ? "双箱制" : "—") + '</div><div class="k-sub">低于下限补至上限与需求较大者</div></div>' +
          "</div></div></div>";

        html += '<div class="panel"><div class="panel-title">补货建议' +
          '<span class="panel-actions"><button class="btn sm" id="rpGen">按建议生成任务</button></span></div>' +
          "<div class='panel-body flush'>" + F.table([
            { label: "物料", render: function (r) { return '<b class="small">' + F.esc(r.item) + "</b>" +
              '<div class="muted small">' + F.esc(r.name) + "</div>"; } },
            { label: "拣货面", num: true, render: function (r) { return F.qty(r.pickface); } },
            { label: "待出需求", num: true, render: function (r) { return F.qty(r.demand); } },
            { label: "建议补货", num: true, render: function (r) { return '<b>' + F.qty(r.qty) + "</b>"; } },
            { label: "来源货位", render: function (r) { return '<span class="mono small">' +
              F.esc(r.storage || "—") + "</span>"; } },
            { label: "目标货位", render: function (r) { return '<span class="mono small">' +
              F.esc(r.pickLoc || "—") + "</span>"; } },
            { label: "紧急", render: function (r) { return r.urgent ? F.tag("断货", "red") :
              F.tag("常规", "gray"); } },
            { label: "", render: function (r) {
              return '<button class="btn sm" data-rp="' + F.esc(r.item) + '" data-qty="' +
                r.qty + '">生成任务</button>';
            } }
          ], sug, { empty: "拣货面库存充足，无需补货" }) + "</div></div>";

        html += '<div class="panel"><div class="panel-title">补货任务</div>' +
          "<div class='panel-body flush'>" + F.table([
            { label: "任务号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
            { label: "物料", render: function (r) { return F.esc(r.item) + " " +
              '<span class="muted small">' + F.esc(r.name) + "</span>"; } },
            { label: "从 → 到", render: function (r) { return '<span class="mono small">' +
              F.esc(r.from_loc) + " → " + F.esc(r.to_loc) + "</span>"; } },
            { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
            { label: "状态", render: function (r) { return F.tag(r.status); } },
            { label: "", render: function (r) {
              return r.status === "待执行" ? '<button class="btn sm primary" data-rpd="' +
                F.esc(r.no) + '">执行补货</button>' : '<span class="small muted">' +
                F.esc(r.done_at || "") + "</span>";
            } }
          ], tasks, { empty: "暂无补货任务" }) + "</div></div>";

        html += '<div class="panel"><div class="panel-title">库内移库' +
          '<span class="panel-actions"><button class="btn sm" id="mvNew">新建移库</button></span></div>' +
          "<div class='panel-body flush'>" + F.table([
            { label: "单号", render: function (r) { return '<span class="mono small">' + F.esc(r.no) + "</span>"; } },
            { label: "物料", render: function (r) { return F.esc(r.item); } },
            { label: "批次", render: function (r) { return '<span class="mono small">' + F.esc(r.lot) + "</span>"; } },
            { label: "从 → 到", render: function (r) { return '<span class="mono small">' +
              F.esc(r.from_loc) + " → " + F.esc(r.to_loc) + "</span>"; } },
            { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
            { label: "操作人", render: function (r) { return F.esc(r.operator); } },
            { label: "时间", render: function (r) { return '<span class="small muted">' +
              F.esc(r.created_at) + "</span>"; } }
          ], t.list, { empty: "暂无移库记录" }) + "</div></div>";

        document.getElementById("view").innerHTML = html;

        document.getElementById("rpGen").addEventListener("click", function () {
          if (!sug.length) { F.toast("当前没有补货建议", "err"); return; }
          var seq = Promise.resolve(), n = 0;
          sug.slice(0, 10).forEach(function (x) {
            seq = seq.then(function () {
              return F.api("POST", "/api/replenish", { item: x.item, qty: x.qty, to: x.pickLoc })
                .then(function () { n += 1; }).catch(function () {});
            });
          });
          seq.then(function () {
            F.toast("已生成 " + n + " 条补货任务", "ok");
            load(); F.boot();
          });
        });
        document.querySelectorAll("[data-rp]").forEach(function (b) {
          b.addEventListener("click", function () {
            F.api("POST", "/api/replenish", {
              item: b.getAttribute("data-rp"), qty: Number(b.getAttribute("data-qty"))
            }).then(function (x) {
              F.toast("已生成补货任务 " + x.no, "ok"); load(); F.boot();
            }).catch(function (e) { F.toast(e.message, "err"); });
          });
        });
        document.querySelectorAll("[data-rpd]").forEach(function (b) {
          b.addEventListener("click", function () {
            F.api("POST", "/api/replenish/" + b.getAttribute("data-rpd") + "/done", {})
              .then(function (x) {
                F.toast("补货完成 " + F.qty(x.qty) + " 件", "ok"); load(); F.boot();
              }).catch(function (e) { F.toast(e.message, "err"); });
          });
        });
        document.getElementById("mvNew").addEventListener("click", function () {
          F.api("GET", "/api/locations?limit=400").then(function (l) {
            F.dialog("新建移库",
              '<div class="form-grid">' +
              '<label>物料<input id="mvItem" placeholder="如 SKU-1021"></label>' +
              '<label>源货位<select id="mvFrom">' + (l.list || []).filter(function (x) {
                return x.stockQty > 0;
              }).map(function (x) {
                return '<option value="' + F.esc(x.code) + '">' + F.esc(x.code) + " · " +
                  F.qty(x.stockQty) + " 件</option>";
              }).join("") + "</select></label>" +
              '<label>目标货位<select id="mvTo">' + (l.list || []).map(function (x) {
                return '<option value="' + F.esc(x.code) + '">' + F.esc(x.code) + " · " +
                  F.esc(x.kind) + "</option>";
              }).join("") + "</select></label>" +
              '<label>数量<input id="mvQty" type="number" value="10"></label></div>',
              '<button class="btn primary" id="mvOk">确认移库</button>');
            document.getElementById("mvOk").addEventListener("click", function () {
              F.api("POST", "/api/transfers", {
                item: document.getElementById("mvItem").value.trim(),
                from: document.getElementById("mvFrom").value,
                to: document.getElementById("mvTo").value,
                qty: Number(document.getElementById("mvQty").value || 0)
              }).then(function (x) {
                F.closeDialog(); F.toast("移库完成 " + x.no, "ok"); load();
              }).catch(function (e) { F.toast(e.message, "err"); });
            });
          }).catch(function (e) { F.toast(e.message, "err"); });
        });

        F.setSide('<div class="side-block"><div class="hd">补货口径</div><div class="bd small muted" ' +
          'style="line-height:1.9">补货量 = max(上限, 待出需求) − 当前拣货面数量；' +
          '拣货面低于下限或低于待出库需求即触发。移库与补货都会写库存流水，可在批次追溯里看到。</div></div>');
        F.setStatus("补货移库 · " + sug.length + " 条建议");
      }).catch(function (e) { F.toast(e.message, "err"); });
    }
    load();
  });
})(window, document);

</script>
<script>
/* 飞传 WMS · 批次追溯与盘点作业 */
(function (window, document) {
  "use strict";
  var F = window.F;

  /* ============================================================ 批次追溯 */
  F.register("trace", function (params) {
    var lot = params.lot || "";
    var order = params.order || "";

    function load() {
      Promise.all([
        lot || order ? F.api("GET", "/api/trace?" + (lot ? "lot=" + encodeURIComponent(lot)
          : "order=" + encodeURIComponent(order))) : Promise.resolve(null),
        F.api("GET", "/api/moves?limit=12"),
        F.api("GET", "/api/lots?limit=12" + (lot ? "&q=" + encodeURIComponent(lot.slice(0, 6)) : ""))
      ]).then(function (res) {
        var t = res[0], mv = res[1], ls = res[2];
        var html = '<div class="panel"><div class="panel-title">批次追溯' +
          '<span class="panel-actions">' +
          '<input class="inp sm" id="trQ" placeholder="输入批次号或出库单号" value="' +
          F.esc(lot || order) + '" style="width:230px">' +
          '<button class="btn sm primary" id="trGo">追溯</button></span></div>' +
          '<div class="panel-body">' +
          '<div class="muted small">支持正向（批次 → 客户）与反向（订单 → 批次）追溯，' +
          '数据来自收货、上架、拣货、移库、盘点全量流水。</div></div></div>';

        if (t) {
          if (t.lots) {
            html += '<div class="panel"><div class="panel-title">出库单 ' + F.esc(t.order) +
              ' 关联批次</div><div class="panel-body">' + t.lots.map(function (x) {
                return '<div class="trace-chip" data-lot="' + F.esc(x.lot) + '"><b>' +
                  F.esc(x.lot) + "</b> " + F.esc(x.name) + " · " + F.qty(x.qty) +
                  " 件 → " + F.esc((x.customers || []).join("、") || "—") + "</div>";
              }).join("") + "</div></div>";
          } else {
            var chain = '<div class="trace-chain">';
            chain += '<div class="tc-col"><div class="tc-hd">入库来源</div>' +
              (t.inbound.length ? t.inbound.map(function (x) {
                return '<div class="tc-card"><b>' + F.esc(x.supplierName || "未知供应商") + "</b>" +
                  '<div class="mono small">' + F.esc(x.asn) + "</div>" +
                  '<div class="muted small">' + F.esc(x.ts) + " · " + F.qty(x.qty) + " 件</div></div>";
              }).join("") : '<div class="tc-card muted">无入库记录</div>') + "</div>";
            chain += '<div class="tc-arrow">→</div>';
            chain += '<div class="tc-col"><div class="tc-hd">当前在库（' + t.stocks.length + " 个货位）</div>" +
              (t.stocks.length ? t.stocks.map(function (x) {
                return '<div class="tc-card"><b class="mono">' + F.esc(x.location) + "</b>" +
                  '<div class="small">' + F.qty(x.qty) + " 件 · 可用 " + F.qty(x.avail) + "</div>" +
                  '<div class="muted small">' + F.esc(x.status) + "</div></div>";
              }).join("") : '<div class="tc-card muted">已全部出库</div>') + "</div>";
            chain += '<div class="tc-arrow">→</div>';
            chain += '<div class="tc-col"><div class="tc-hd">出库去向（' + t.outbound.length + " 单）</div>" +
              (t.outbound.length ? t.outbound.map(function (x) {
                return '<div class="tc-card"><b>' + F.esc(x.customerName || "—") + "</b>" +
                  '<div class="mono small">' + F.esc(x.order) + "</div>" +
                  '<div class="muted small">' + F.esc(x.ts) + " · " + F.qty(x.qty) + " 件" +
                  (x.trackingNo ? " · " + F.esc(x.trackingNo) : "") + "</div></div>";
              }).join("") : '<div class="tc-card muted">尚未出库</div>') + "</div>";
            chain += "</div>";

            html += '<div class="panel"><div class="panel-title">批次 ' + F.esc(t.lot) +
              ' · ' + F.esc(t.name) + '<span class="panel-actions">' + F.tag(t.expiryLevel) +
              "</span></div><div class='panel-body'>" +
              '<div class="kpi-grid four">' +
              '<div class="kpi"><div class="k-label">当前在库</div><div class="k-value">' +
              F.qty(t.qty) + '</div><div class="k-sub">累计入库 ' + F.qty(t.qtyIn) +
              " · 已出 " + F.qty(t.outQty) + "</div></div>" +
              '<div class="kpi green"><div class="k-label">货值</div><div class="k-value">' +
              F.wan(t.qty * t.price) + '</div><div class="k-sub">单价 ' + F.num(t.price, 2) + "</div></div>" +
              '<div class="kpi ' + (t.expiryLevel === "临期" ? "gold" : (t.expiryLevel === "已过期" ?
                "red" : "")) + '"><div class="k-label">剩余保质期</div><div class="k-value">' +
              (t.daysLeft === null ? "—" : t.daysLeft + " 天") +
              '</div><div class="k-sub">有效期 ' + F.esc(t.expiry || "—") + "</div></div>" +
              '<div class="kpi"><div class="k-label">物料</div><div class="k-value" style="font-size:15px">' +
              F.esc(t.item) + '</div><div class="k-sub">' + F.esc(t.abc) + " 类 · " +
              F.esc(t.storage) + "</div></div></div>" +
              '<div class="kv-grid">' +
              F.kv("供应商", F.esc(t.supplier || "—")) +
              F.kv("入库时间", F.esc(t.inboundAt || "—")) +
              F.kv("生产日期", F.esc(t.mfgDate || "—")) +
              F.kv("涉及客户", (t.customers || []).length ? F.esc(t.customers.join("、")) : "—") +
              "</div>" + chain + "</div></div>";

            html += '<div class="panel"><div class="panel-title">库存流水（' + t.moves.length +
              " 条）</div><div class='panel-body flush'>" + F.table([
                { label: "时间", render: function (r) { return '<span class="mono small">' +
                  F.esc(r.ts) + "</span>"; } },
                { label: "类型", render: function (r) { return F.tag(r.type, r.type === "拣货出库" ?
                  "gold" : (r.type === "上架" ? "green" : "blue")); } },
                { label: "从 → 到", render: function (r) { return '<span class="mono small">' +
                  F.esc(r.from_loc || "—") + " → " + F.esc(r.to_loc || "—") + "</span>"; } },
                { label: "数量", num: true, render: function (r) { return F.qty(r.qty); } },
                { label: "关联单据", render: function (r) { return '<span class="mono small">' +
                  F.esc(r.ref_no || "—") + "</span>"; } },
                { label: "操作人", render: function (r) { return F.esc(r.operator); } }
              ], t.moves) + "</div></div>";

            if ((t.related || []).length) {
              html += '<div class="panel"><div class="panel-title">同物料其他批次</div>' +
                '<div class="panel-body">' + t.related.map(function (x) {
                  return '<div class="trace-chip" data-lot="' + F.esc(x.lot) + '"><b>' +
