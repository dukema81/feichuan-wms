<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞传WMS系统 · 离线演示版</title>
<style>
:root {
  --bg: #0f1c26;
  --bar: #12262f;
  --bar2: #1a3540;
  --line: #d8dee4;
  --ink: #1f2d38;
  --muted: #6b7a88;
  --accent: #1f7a8c;
  --accent2: #2b9eb3;
  --gold: #c8963e;
  --up: #c0392b;
  --down: #1e8449;
  --warn: #b7791f;
  --bg-soft: #f4f7f9;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  font-size: 13px;
  color: var(--ink);
  background: var(--bg-soft);
}

a { color: var(--accent); text-decoration: none; }
.spacer { flex: 1; }
.mono { font-family: Consolas, "Courier New", monospace; }
.small { font-size: 12px; }
.muted { color: var(--muted); }
.num { text-align: right; font-family: Consolas, monospace; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--muted); }

/* ---------------------------------------------------------------- 应用骨架 */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-width: 1180px;
}

.titlebar {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 54px;
  padding: 0 14px;
  background: linear-gradient(180deg, #16323d, #10242c);
  color: #eaf2f5;
  border-bottom: 1px solid #0a171d;
}
.titlebar .brand { display: flex; align-items: center; gap: 10px; }
.titlebar .logo {
  width: 34px; height: 34px; line-height: 34px; text-align: center;
  background: linear-gradient(145deg, var(--accent2), var(--accent));
  border-radius: 8px; font-weight: 700; color: #fff; font-size: 17px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
}
.titlebar .co { font-size: 13px; font-weight: 600; letter-spacing: .5px; }
.titlebar .sys { font-size: 11px; color: #8fb0bd; margin-top: 2px; }
.titlebar .ver { font-size: 11px; color: #7f9dab; }
.titlebar .opuser { font-size: 12px; color: #cfe0e6; }
.titlebar .winbtns { display: flex; gap: 14px; margin-left: 12px; color: #9ab4bf; font-size: 12px; }
.titlebar .winbtns .close:hover { color: #ff8b7a; }

.menubar {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 36px;
  padding: 0 8px;
  background: var(--bar2);
  border-bottom: 1px solid #0d1e26;
}
.menubar button {
  background: transparent;
  border: 0;
  color: #cfe0e6;
  font-size: 12.5px;
  padding: 6px 13px;
  border-radius: 4px;
  cursor: pointer;
}
.menubar button:hover { background: rgba(255, 255, 255, .1); }
.menubar button.on { background: var(--accent); color: #fff; }

.body { display: flex; flex: 1; min-height: 0; }

.tree {
  width: 186px;
  background: #fff;
  border-right: 1px solid var(--line);
  overflow: auto;
  padding: 8px 0;
}
.tree-title {
  font-size: 11.5px; color: var(--muted); padding: 6px 14px 8px;
  border-bottom: 1px solid #eef1f4; margin-bottom: 6px;
}
.tree .grp { font-size: 12px; color: var(--muted); padding: 8px 14px 4px; }
.tree a {
  display: block; padding: 7px 14px 7px 24px; color: #33434f; font-size: 12.5px;
  border-left: 3px solid transparent;
}
.tree a:hover { background: #f2f7f9; }
.tree a.on { background: #e8f4f7; color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

.workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tabstrip {
  height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px;
  background: #e9eef2; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted);
}
.tabstrip .tab {
  background: #fff; border: 1px solid var(--line); border-bottom: 0;
  padding: 4px 12px; border-radius: 4px 4px 0 0; color: var(--ink);
}
.page { flex: 1; overflow: auto; padding: 12px; }

.side {
  width: 262px;
  background: #fff;
  border-left: 1px solid var(--line);
  overflow: auto;
  padding: 10px;
}
.side-block { border: 1px solid #e6ecf0; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
.side-block .hd {
  background: #f3f7f9; padding: 7px 10px; font-size: 12px; font-weight: 600;
  color: #3b4c58; border-bottom: 1px solid #e6ecf0;
}
.side-block .bd { padding: 9px 10px; }
.side-kv { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; }
.side-kv span { color: var(--muted); }

.statusbar {
  height: 26px; display: flex; align-items: center; gap: 18px; padding: 0 12px;
  background: #16323d; color: #b9cdd6; font-size: 11.5px;
}
.statusbar b { color: #eaf2f5; font-weight: 600; }

/* ---------------------------------------------------------------- 通用块 */
.panel {
  background: #fff; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 12px;
  box-shadow: 0 1px 2px rgba(16, 36, 44, .04);
}
.panel-title {
  padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: #2c3e4a;
  border-bottom: 1px solid #edf1f4; display: flex; align-items: center; gap: 8px;
}
.panel-body { padding: 12px; }
.panel-body.flush { padding: 0; }
.panel-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
.kpi-grid.six { grid-template-columns: repeat(6, 1fr); }
.kpi-grid.three { grid-template-columns: repeat(3, 1fr); }
.kpi {
  background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 11px 13px;
  border-top: 3px solid var(--accent);
}
.kpi.gold { border-top-color: var(--gold); }
.kpi.green { border-top-color: var(--down); }
.kpi.red { border-top-color: var(--up); }
.kpi .k-label { font-size: 11.5px; color: var(--muted); }
.kpi .k-value { font-size: 21px; font-weight: 700; margin-top: 5px; letter-spacing: -.3px; }
.kpi .k-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

table.grid-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.grid-table th {
  background: #f4f7f9; text-align: left; padding: 8px 10px; font-weight: 600;
  color: #46586a; border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.grid-table td { padding: 7px 10px; border-bottom: 1px solid #eef2f5; }
table.grid-table tbody tr:hover { background: #f8fbfc; }
table.grid-table tr.clickable { cursor: pointer; }
table.grid-table .empty-row td { text-align: center; color: var(--muted); padding: 26px; }
table.grid-table td.num, table.grid-table th.num { text-align: right; font-family: Consolas, monospace; }

.tag {
  display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
  background: #eef2f5; color: #55636f; line-height: 18px;
}
.tag.blue { background: #e3f1f5; color: #1f7a8c; }
.tag.green { background: #e6f4ec; color: #1e8449; }
.tag.red { background: #fbeae7; color: #c0392b; }
.tag.gold { background: #fbf2e0; color: #a9772a; }
.tag.gray { background: #eef2f5; color: #6b7a88; }

.btn {
  border: 1px solid var(--line); background: #fff; color: #33434f; padding: 5px 13px;
  border-radius: 4px; cursor: pointer; font-size: 12.5px;
}
.btn:hover { border-color: var(--accent2); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent2); }
.btn.danger { color: var(--up); border-color: #eccdc9; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 3px 9px; font-size: 12px; }

input[type=text], input[type=number], input[type=date], select, textarea {
  border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font-size: 12.5px;
  color: var(--ink); background: #fff; outline: none; font-family: inherit;
}
input:focus, select:focus { border-color: var(--accent2); }
.form-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.form-row label { font-size: 12px; color: var(--muted); }

.msg-list { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.msg-list .err { color: var(--up); }
.msg-list .warn { color: var(--warn); }
.msg-list .pass { color: var(--down); }

.progress {
  height: 6px; background: #eef2f5; border-radius: 3px; overflow: hidden; width: 90px;
  display: inline-block; vertical-align: middle;
}
.progress i { display: block; height: 100%; background: var(--accent2); }

.spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 20px; }
.spark i { width: 4px; display: block; background: #cfd8de; }

/* 抽屉 / 弹窗 */
.mask {
  position: fixed; inset: 0; background: rgba(10, 24, 30, .45); display: none;
  align-items: center; justify-content: center; z-index: 90;
}
.mask.on { display: flex; }
.dialog {
  background: #fff; border-radius: 8px; width: 860px; max-width: 94vw; max-height: 88vh;
  overflow: auto; box-shadow: 0 10px 40px rgba(0, 0, 0, .3);
}
.dialog .dh {
  padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600;
  display: flex; align-items: center;
}
.dialog .dh .x { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 16px; }
.dialog .db { padding: 14px 16px; }
.dialog .df {
  padding: 11px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px;
  justify-content: flex-end;
}

/* 登录页 */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 20% 20%, #1d4453, #0c1a21 65%);
}
.login-card {
  width: 880px; display: flex; background: #fff; border-radius: 10px; overflow: hidden;
  box-shadow: 0 18px 60px rgba(0, 0, 0, .45);
}
.login-left {
  width: 420px; padding: 42px 36px; color: #eaf4f7;
  background: linear-gradient(160deg, #17505f, #0f2a34);
  display: flex; flex-direction: column;
}
.login-left .lg { font-size: 26px; font-weight: 700; letter-spacing: 4px; }
.login-left .sub { font-size: 12.5px; color: #9fc3cf; margin-top: 8px; line-height: 1.9; }
.login-left ul { margin: 22px 0 0; padding-left: 18px; font-size: 12px; color: #bcd6de; line-height: 2; }
.login-right { flex: 1; padding: 46px 40px; }
.login-right h2 { margin: 0 0 6px; font-size: 18px; }
.login-right .hint { font-size: 12px; color: var(--muted); margin-bottom: 22px; }
.login-right .field { margin-bottom: 14px; }
.login-right .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.login-right .field input { width: 100%; padding: 9px 11px; }
.login-right .btn.primary { width: 100%; padding: 9px; margin-top: 6px; font-size: 13.5px; }
.login-err { color: var(--up); font-size: 12px; min-height: 18px; margin-top: 8px; }
.login-demo { margin-top: 18px; font-size: 11.5px; color: var(--muted); line-height: 1.9; }

.chart-legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); }
.chart-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }

/* ---------------------------------------------------------- 流程审批 */
.nav-badge { display: inline-block; min-width: 16px; padding: 0 5px; margin-left: 6px;
  background: var(--up, #c0392b); color: #fff; border-radius: 9px; font-size: 10.5px;
  line-height: 16px; text-align: center; font-weight: 600; }

.btn.xs { padding: 2px 8px; font-size: 11.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.apv-title { font-size: 15px; font-weight: 600; margin: 6px 0 4px; }

.apv-nodes { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
.apv-node { display: flex; gap: 8px; align-items: flex-start; min-width: 168px; flex: 1;
  border: 1px solid #e3eaef; border-radius: 6px; padding: 8px 10px; background: #fbfcfd; }
.apv-node.on { border-color: var(--accent2); background: #eff9fb; }
.apv-node.ok { border-color: #9ed3b4; background: #f2fbf6; }
.apv-node.no { border-color: #e6b0a8; background: #fdf4f2; }
.apv-node.skip { opacity: .55; }
.apv-dot { width: 18px; height: 18px; border-radius: 50%; background: #eef2f5; color: #6b7a88;
  font-size: 11px; line-height: 18px; text-align: center; flex: 0 0 18px; }
.apv-node.on .apv-dot { background: var(--accent2); color: #fff; }
.apv-node.ok .apv-dot { background: #1e8449; color: #fff; }
.apv-node.no .apv-dot { background: #c0392b; color: #fff; }
.apv-nb { min-width: 0; }
.apv-nm { font-size: 12.5px; font-weight: 600; }
.apv-cs { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
.apv-chip { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: #eef2f5; color: #5d6f7c; }
.apv-chip.on { background: #fbf2e0; color: #a9772a; }
.apv-chip.no { background: #fbeae7; color: #c0392b; }

.apv-tl { border-left: 2px solid #e3eaef; margin-left: 6px; padding-left: 12px; }
.apv-ti { position: relative; padding: 3px 0 7px; font-size: 12px; }
.apv-ti::before { content: ""; position: absolute; left: -18px; top: 8px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent2); }
.apv-time { color: #8b9aa6; margin-right: 8px; }
.apv-act { font-weight: 600; margin-right: 6px; }
.apv-who { color: #33475b; margin-right: 6px; }
.apv-cm { color: #5d6f7c; margin: 3px 0 0 2px; line-height: 1.7; }

.apv-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 14px; font-size: 12.5px; }
.apv-form i { display: block; font-style: normal; color: #8b9aa6; font-size: 11px; }

.apv-ncard { border: 1px dashed #d6e0e7; border-radius: 6px; padding: 6px 10px 2px; margin-bottom: 8px; background: #fbfcfd; }
.apv-ncard .form-row { margin-bottom: 4px; }

/* ---------------------------------------------------------- CRM 组件 */
.kpi-grid.four { grid-template-columns: repeat(4, 1fr); }
.kpi-grid.five { grid-template-columns: repeat(5, 1fr); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: #fff; color: #4a5b68; border-radius: 14px;
  padding: 3px 11px; font-size: 12px; cursor: pointer;
}
.chip b { margin-left: 6px; color: var(--muted); font-weight: 600; }
.chip.on { background: #e8f4f7; border-color: var(--accent2); color: var(--accent); }
.chip.on b { color: var(--accent); }

.empty-hint { color: var(--muted); font-size: 12px; padding: 14px; text-align: center; }

/* 看板 */
.board { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
.board .col {
  flex: 1 0 200px; background: #f7fafb; border: 1px solid #e6ecf0; border-radius: 6px;
  padding: 8px; min-height: 220px;
}
.board .col-hd {
  font-size: 12px; font-weight: 600; color: #3b4c58; margin-bottom: 8px;
  display: flex; justify-content: space-between;
}
.board .col-hd span { font-weight: 400; color: var(--muted); font-size: 11px; }
.card {
  background: #fff; border: 1px solid #e3eaef; border-radius: 5px; padding: 8px 9px;
  margin-bottom: 7px; cursor: pointer; box-shadow: 0 1px 1px rgba(16, 36, 44, .03);
}
.card:hover { border-color: var(--accent2); box-shadow: 0 2px 8px rgba(31, 122, 140, .12); }
.card-t { font-size: 12.5px; font-weight: 600; color: #263943; line-height: 1.4; }
.card-c { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.card-m { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; font-size: 11.5px; }
.card-m b { font-size: 13px; color: #1f7a8c; }
.card-m span { color: var(--muted); }
.card-f { margin-top: 6px; font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

/* 漏斗 */
.funnel { display: flex; flex-direction: column; gap: 7px; }
.fn-row { display: grid; grid-template-columns: 150px 1fr 120px 60px; gap: 10px; align-items: center; }
.fn-name { font-size: 12.5px; color: #33434f; }
.fn-bar { height: 18px; background: #eef3f6; border-radius: 3px; overflow: hidden; }
.fn-bar i {
  display: block; height: 100%;
  background: linear-gradient(90deg, #2b9eb3, #1f7a8c);
}
.fn-val { font-size: 12px; text-align: right; font-family: Consolas, monospace; }
.fn-conv { font-size: 11.5px; color: var(--down); text-align: right; }
.funnel-mini { display: flex; gap: 10px; flex-wrap: wrap; }
.funnel-mini .fm {
  flex: 1 0 120px; border: 1px solid #e6ecf0; border-radius: 5px; padding: 8px 10px;
  background: #fbfdfe;
}
.funnel-mini .fm-v { font-size: 15px; font-weight: 700; color: #1f7a8c; }
.funnel-mini .fm-l { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

/* 时间线 */
.timeline { border-left: 2px solid #e3eaef; margin: 4px 0 4px 6px; padding-left: 12px; }
.tl-item { position: relative; padding: 3px 0 8px; font-size: 12px; color: #33434f; line-height: 1.7; }
.tl-item::before {
  content: ""; position: absolute; left: -17px; top: 9px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent2);
}
.tl-time { color: #8b9aa6; margin-right: 8px; font-family: Consolas, monospace; font-size: 11px; }

/* 详情头 */
.detail-head { display: flex; align-items: flex-start; gap: 12px; }
.dh-title { font-size: 16px; font-weight: 600; color: #22333d; }
.dh-tags { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.section-title {
  font-size: 12px; font-weight: 600; color: #3b4c58; margin: 14px 0 8px;
  border-left: 3px solid var(--accent2); padding-left: 8px;
}
.note {
  background: #f6f9fb; border: 1px solid #e6ecf0; border-radius: 5px; padding: 9px 11px;
  font-size: 12.5px; color: #42555f; line-height: 1.8; margin: 8px 0;
}
.warn-box {
  background: #fdf6e9; border: 1px solid #f0dcb8; color: #8a6420; border-radius: 5px;
  padding: 8px 11px; font-size: 12px; margin: 8px 0; line-height: 1.7;
}
.ok-box {
  background: #f1faf4; border: 1px solid #c9e8d5; color: #1e6b43; border-radius: 5px;
  padding: 8px 11px; font-size: 12px; margin: 8px 0; line-height: 1.7;
}
.form-grid { display: grid; grid-template-columns: 110px 1fr 110px 1fr; gap: 8px 10px; align-items: center; }
.form-grid label { font-size: 12px; color: var(--muted); text-align: right; }
.form-grid input, .form-grid select, .form-grid textarea { width: 100%; }
.gate { display: flex; flex-direction: column; gap: 5px; }
.gate-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0;
  border-bottom: 1px dashed #eef2f5; }

.score {
  display: inline-block; min-width: 28px; text-align: center; padding: 1px 6px;
  border-radius: 4px; font-size: 11.5px; font-weight: 700; font-family: Consolas, monospace;
}
.score.green { background: #e6f4ec; color: #1e8449; }
.score.blue { background: #e3f1f5; color: #1f7a8c; }
.score.gold { background: #fbf2e0; color: #a9772a; }
.score.red { background: #fbeae7; color: #c0392b; }

.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px;
  background: #eef2f5; color: #55636f; }
.pill.s2 { background: #fbf2e0; color: #a9772a; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.tabs button {
  border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 6px 14px;
  font-size: 12.5px; color: #55636f; cursor: pointer; border-radius: 4px 4px 0 0;
}
.tabs button.on { background: #fff; border-color: var(--line); color: var(--accent); font-weight: 600; }

.code {
  background: #0f2029; color: #d7e6ec; border-radius: 5px; padding: 9px 11px; font-size: 11.5px;
  font-family: Consolas, monospace; line-height: 1.7; overflow-x: auto; white-space: pre;
  margin: 6px 0 0;
}
code { background: #f1f5f8; padding: 1px 5px; border-radius: 3px; font-size: 11.5px;
  font-family: Consolas, monospace; color: #1f5f6d; }
.keybox {
  font-family: Consolas, monospace; font-size: 12.5px; background: #0f2029; color: #9ee6b8;
  padding: 12px; border-radius: 5px; word-break: break-all; margin: 8px 0;
}
.intg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    var saved = sessionStorage.getItem(STORE_KEY);
    if (saved) {
      var parsed = JSON.parse(saved);
      if (parsed && parsed.asnD && parsed.orderD) DB = window.DB = parsed;
    }
  } catch (e) { /* 隐私模式忽略 */ }

  function persist() {
    try {
      var s = JSON.stringify(DB);
      if (s.length < 4.5e6) sessionStorage.setItem(STORE_KEY, s);
    } catch (e) { /* 超限或隐私模式忽略 */ }
  }

  var NOW = new Date();
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function r2(v) { return Math.round((Number(v || 0) + 1e-9) * 100) / 100; }
  function r4(v) { return Math.round((Number(v || 0) + 1e-9) * 10000) / 10000; }
  function today() {
    return NOW.getFullYear() + "-" + pad(NOW.getMonth() + 1) + "-" + pad(NOW.getDate());
  }
  function nowStr() {
    return today() + " " + pad(NOW.getHours()) + ":" + pad(NOW.getMinutes()) + ":" +
      pad(NOW.getSeconds());
  }
  function addDays(n) {
    var d = new Date(NOW.getTime() + n * 86400000);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function find(list, key, val) {
    for (var i = 0; i < (list || []).length; i++) if (list[i][key] === val) return list[i];
    return null;
  }
  function docNo(list, prefix) {
    var max = 0;
    (list || []).forEach(function (x) {
      var m = String(x.no || "").match(/(\d+)$/);
      if (m) max = Math.max(max, Number(m[1]));
    });
    return prefix + today().replace(/-/g, "") + "-" + ("000" + (max + 1)).slice(-4);
  }
  function daysLeft(expiry) {
    if (!expiry) return null;
    var d = new Date(expiry + "T00:00:00"), t = new Date(today() + "T00:00:00");
    return Math.round((d - t) / 86400000);
  }
  function expLevel(expiry) {
    var n = daysLeft(expiry);
    if (n === null) return "正常";
    if (n < 0) return "已过期";
    if (n <= 30) return "临期";
    if (n <= 90) return "关注";
    return "正常";
  }
  function cubeOf(l, w, h, qty) {
    return r4(Number(l || 0) * Number(w || 0) * Number(h || 0) * Number(qty || 1) / 1e6);
  }

  /* 演示环境固定以管理员身份进入 */
  DB.me = { username: "admin", displayName: "系统管理员", role: "admin",
    roleLabel: "系统管理员", authType: "demo",
    perms: ["read", "write", "receive", "putaway", "pick", "pack", "ship", "alloc",
      "count", "adjust", "approve"] };
  DB.boot.user = DB.me;
  DB.__changes = DB.sync.list || [];
  DB.__changeId = DB.__changes.reduce(function (a, c) { return Math.max(a, c.id || 0); }, 0);
  DB.__keySeq = (DB.integ.keys.list || []).reduce(function (a, k) { return Math.max(a, k.id); }, 0);
  DB.__hookSeq = (DB.integ.webhooks.list || []).reduce(function (a, k) { return Math.max(a, k.id); }, 0);
  DB.__dlvSeq = (DB.integ.deliveries.list || []).reduce(function (a, k) { return Math.max(a, k.id); }, 0);
  DB.__mapSeq = (DB.integ.mappings.list || []).reduce(function (a, k) { return Math.max(a, k.id); }, 0);
  DB.__logs = DB.logs.list || [];

  var ASN_FLOW = ["草稿", "已预约", "已到货", "收货中", "已收货", "已上架", "已关闭"];
  var SO_FLOW = ["草稿", "已提交", "已分配", "拣货中", "已拣货", "已复核", "已发运", "已签收"];
  var ST_FLOW = ["草稿", "盘点中", "待审核", "已调整", "已关闭"];

  function idx(flow, s) { return flow.indexOf(s); }

  function log(action, detail) {
    DB.__logs.unshift({ id: (DB.__logs.length ? DB.__logs[0].id : 0) + 1,
      username: DB.me.username, action: action, detail: detail || "",
      ip: "127.0.0.1", created_at: nowStr() });
    if (DB.__logs.length > 300) DB.__logs.pop();
    DB.__changeId += 1;
    DB.__changes.push({ id: DB.__changeId, object: "op", object_id: String(detail || ""),
      action: action, actor: DB.me.username, payload: "{}", changed_at: nowStr() });
    DB.integ.overview.changes = DB.__changes.length;
    DB.integ.overview.lastChange = nowStr();
  }

  /* ------------------------------------------------------------ 库存口径 */
  function itemOf(code) { return DB.itemD[code] || {}; }

  function stockRows() { return DB.stock.list; }

  function findStock(item, lot, loc) {
    return stockRows().filter(function (s) {
      return s.item === item && s.lot === lot && s.location === loc;
    })[0] || null;
  }

  function addStock(item, lot, loc, qty, price, expiry) {
    var s = findStock(item, lot, loc);
    if (s) {
      s.qty = r2(s.qty + qty);
    } else {
      s = { id: -Math.floor(Math.random() * 1e9), whCode: "WH-SZ01", item: item,
        name: itemOf(item).name || "", abc: itemOf(item).abc || "",
        category: itemOf(item).category || "", unit: itemOf(item).unit || "",
        lot: lot, location: loc, qty: r2(qty), allocated: 0, frozen: 0, price: r2(price || 0),
        amount: r2(qty * (price || 0)), expiry: expiry || "", daysLeft: daysLeft(expiry),
        expiryLevel: expLevel(expiry), inboundAt: nowStr(), ageDays: 0, status: "正常" };
      stockRows().unshift(s);
    }
    s.avail = r2(s.qty - s.allocated - s.frozen);
    s.amount = r2(s.qty * s.price);
    var lotRow = (DB.lots.list || []).filter(function (x) { return x.lot === lot; })[0];
    if (lotRow) lotRow.qty = r2(Number(lotRow.qty || 0) + qty);
    var locRow = find(DB.locations.list, "code", loc);
    if (locRow) {
      locRow.used = r2(Number(locRow.used || 0) + cubeOf(itemOf(item).length,
        itemOf(item).width, itemOf(item).height, qty));
      locRow.util = r4(locRow.capacity ? locRow.used / locRow.capacity : 0);
      locRow.stockQty = r2(Number(locRow.stockQty || 0) + qty);
      locRow.skuCount = (locRow.skuCount || 0) + (s.qty === qty ? 1 : 0);
    }
    return s;
  }

  function takeStock(item, lot, loc, qty) {
    var s = findStock(item, lot, loc);
    if (!s) return false;
    s.qty = r2(Math.max(0, s.qty - qty));
    s.allocated = r2(Math.max(0, s.allocated - qty));
    s.avail = r2(s.qty - s.allocated - s.frozen);
    var locRow = find(DB.locations.list, "code", loc);
    if (locRow) {
      locRow.used = r2(Math.max(0, Number(locRow.used || 0) -
        cubeOf(itemOf(item).length, itemOf(item).width, itemOf(item).height, qty)));
      locRow.util = r4(locRow.capacity ? locRow.used / locRow.capacity : 0);
    }
    return true;
  }

  function addMove(type, item, lot, from, to, qty, refNo, note) {
    DB.moves.list.unshift({ id: -Math.floor(Math.random() * 1e9), no: docNo([], "MV") +
      "-" + Math.floor(Math.random() * 90 + 10), ts: nowStr(), type: type, item: item,
      lot: lot, from_loc: from || "", to_loc: to || "", qty: r2(qty), ref_no: refNo || "",
      operator: DB.me.username, note: note || "" });
    if (DB.moves.total !== undefined) DB.moves.total += 1;
    DB.moves.list = DB.moves.list.slice(0, 800);
  }

  /* ------------------------------------------------------------ 门禁口径 */
  function asnCtx(a) {
    var items = a.items || [], tot = 0, recv = 0, diffOpen = 0;
    items.forEach(function (x) {
      tot += Number(x.qty || 0); recv += Number(x.receivedQty || 0);
      if (Number(x.receivedQty || 0) < Number(x.qty || 0) * 0.98 && !x.diffReason) diffOpen += 1;
    });
    var qcDone = items.length > 0 && items.every(function (x) {
      return Number(x.receivedQty || 0) <= 0 || x.qcStatus !== "待检";
    });
    var qcOk = qcDone && !items.some(function (x) { return x.qcStatus === "不合格"; });
    var tasks = a.tasks || [];
    var putawayDone = tasks.length > 0 && tasks.every(function (t) { return t.status === "已完成"; });
    var posted = (a.moves || []).some(function (m) { return m.type === "上架"; });
    var sup = find(DB.suppliers.list, "code", a.supplier);
    return { status: a.status, items: items.length, qty: r2(tot), received: r2(recv),
      receivedRate: r4(tot ? recv / tot : 0), supplierOk: !!(sup && sup.status === "启用"),
      expectDate: a.expectDate, arriveDate: a.arriveAt, diffOpen: diffOpen,
      qcDone: qcDone, qcOk: qcOk, putawayDone: putawayDone, stockPosted: posted,
      taskCount: tasks.length };
  }

  function gateList(flow, target, miss, cur) {
    return flow.filter(function (t) {
      return idx(flow, t) > idx(flow, cur);
    }).map(function (t) {
      var m = t === target ? miss : gateMiss(flow, t, cur);
      return { target: t, ok: !(m && m.length), missing: m || [],
        next: t === flow[idx(flow, cur) + 1], cancel: false };
    });
    function gateMiss(f, t, c) {
      if (f === ASN_FLOW) return asnGateMiss(t, asnCtx(cur.__asn));
      if (f === SO_FLOW) return soGateMiss(t, soCtx(cur.__order));
      return stGateMiss(t, stCtx(cur.__st));
    }
  }

  function asnGate(target, a) {
    var ctx = asnCtx(a), miss = [];
    if (target === "已预约") {
      if (!ctx.supplierOk) miss.push("供应商未启用或不存在");
      if (ctx.items <= 0) miss.push("到货通知没有明细行");
      if (!ctx.expectDate) miss.push("未填写预约到货日期");
    } else if (target === "已到货") {
      if (!ctx.arriveDate) miss.push("未登记实际到货时间");
      if (ctx.status !== "已预约") miss.push("单据未处于已预约状态");
    } else if (target === "已收货") {
      if (ctx.receivedRate < 1 - 1e-9) {
        miss.push("收货完成度 " + Math.round(ctx.receivedRate * 100) + "%，未收齐");
      }
      if (ctx.diffOpen > 0) miss.push("存在 " + ctx.diffOpen + " 行未处置的收货差异");
    } else if (target === "已上架") {
      if (!ctx.qcDone) miss.push("来料质检未完成");
      if (!ctx.qcOk) miss.push("来料质检未判定合格（可让步接收后再上架）");
      if (!ctx.putawayDone) miss.push("上架任务未全部完成");
    } else if (target === "已关闭") {
      if (!ctx.stockPosted) miss.push("库存尚未正式入账");
    }
    return { miss: miss, ctx: ctx };
  }

  function asnGateView(a) {
    var out = [], nxt = ASN_FLOW[idx(ASN_FLOW, a.status) + 1] || null;
    ASN_FLOW.forEach(function (t) {
      if (idx(ASN_FLOW, t) <= idx(ASN_FLOW, a.status)) return;
      var g = asnGate(t, a);
      out.push({ target: t, ok: !g.miss.length, missing: g.miss,
        next: t === nxt, cancel: false });
    });
    return { ctx: asnCtx(a), gates: out, next: nxt,
      cancelable: ["已上架", "已关闭", "已取消"].indexOf(a.status) < 0 };
  }

  function soCtx(o) {
    var items = o.items || [];
    var pickedAll = items.length > 0 && items.every(function (x) {
      return Number(x.pickedQty || 0) >= Number(x.qty || 0) - 1e-9;
    });
    var packs = o.packages ? [o.packages] : (o.packageNo ? [1] : []);
    var cr = find(DB.carriers.list, "code", o.carrier);
    return { status: o.status, items: items.length,
      customerOk: !!(find(DB.customers.list, "code", o.customer) || {}).code,
      fillRate: Number(o.fillRate || 0),
      allocDone: Number(o.allocatedQty || 0) > 0,
      waveNo: o.waveNo || "", pickedAll: pickedAll,
      packCount: o.packages ? 1 : 0, checkDiff: 0,
      carrierOk: !!(cr && cr.status === "启用"),
      trackingNo: o.trackingNo || "", signedAt: o.signedAt || "" };
  }

  function soGate(target, o) {
    var ctx = soCtx(o), miss = [];
    if (target === "已提交") {
      if (ctx.items <= 0) miss.push("出库单没有明细行");
      if (!ctx.customerOk) miss.push("客户被冻结或不存在");
    } else if (target === "已发运") {
      if (!ctx.carrierOk) miss.push("承运商未启用或不存在");
      if (!ctx.trackingNo) miss.push("尚未生成运单号");
    } else if (target === "已签收") {
      if (!ctx.signedAt) miss.push("未登记签收时间");
    }
    return { miss: miss, ctx: ctx };
  }

  function soGateView(o) {
    var out = [], nxt = SO_FLOW[idx(SO_FLOW, o.status) + 1] || null;
    ["已提交", "已发运", "已签收"].forEach(function (t) {
      if (idx(SO_FLOW, t) <= idx(SO_FLOW, o.status)) return;
      var g = soGate(t, o);
      out.push({ target: t, ok: !g.miss.length, missing: g.miss, next: t === nxt, cancel: false });
    });
    return { ctx: soCtx(o), gates: out, next: nxt,
      cancelable: ["拣货中", "已拣货", "已复核", "已发运", "已签收", "已取消"].indexOf(o.status) < 0 };
  }

  function stCtx(t) {
    var items = t.items || [];
    var countedAll = items.length > 0 && items.every(function (x) { return x.status === "已盘"; });
    var diffLines = items.filter(function (x) {
      return Math.abs(Number(x.diffQty || 0)) > 1e-9;
    }).length;
    return { status: t.status, items: items.length, countedAll: countedAll,
      diffLines: diffLines, adjusted: diffLines === 0 || t.adjusted,
      approveBy: t.approveBy || "" };
  }

  function stGateView(t) {
    var ctx = stCtx(t), out = [];
    ["待审核", "已调整", "已关闭"].forEach(function (tg) {
      if (idx(ST_FLOW, tg) <= idx(ST_FLOW, t.status)) return;
      var miss = [];
      if (tg === "待审核" && !ctx.countedAll) miss.push("仍有货位未录入实盘数");
      if (tg === "已调整") {
        if (!ctx.approveBy && tg !== "已调整") miss.push("未经审核人放行");
        if (ctx.diffLines > 0 && !ctx.adjusted) miss.push("存在差异行但未生成库存调整");
      }
      if (tg === "已关闭" && ctx.status !== "已调整") miss.push("盘点单未完成调整");
      out.push({ target: tg, ok: !miss.length, missing: miss,
        next: tg === ST_FLOW[idx(ST_FLOW, t.status) + 1], cancel: false });
    });
    return { ctx: ctx, gates: out };
  }

  function refreshAsn(a) {
    var tot = 0, recv = 0;
    (a.items || []).forEach(function (x) {
      tot += Number(x.qty || 0); recv += Number(x.receivedQty || 0);
    });
    a.qty = r2(tot); a.receivedQty = r2(recv);
    a.receivedRate = r4(tot ? recv / tot : 0);
    a.lineCount = (a.items || []).length;
    a.gate = asnGateView(a);
    var row = find(DB.asns.list, "no", a.no);
    if (row) { row.status = a.status; row.receivedRate = a.receivedRate; }
  }

  function refreshOrder(o) {
    var tot = 0, alloc = 0, picked = 0;
    (o.items || []).forEach(function (x) {
      tot += Number(x.qty || 0); alloc += Number(x.allocatedQty || 0);
      picked += Number(x.pickedQty || 0);
    });
    o.qty = r2(tot); o.allocatedQty = r2(alloc); o.pickedQty = r2(picked);
    o.lineCount = (o.items || []).length;
    o.progress = r4(tot ? picked / tot : 0);
    o.gate = soGateView(o);
    var row = find(DB.orders.list, "no", o.no);
    if (row) { row.status = o.status; row.fillRate = o.fillRate; row.progress = o.progress; }
  }

  function refreshSt(t) {
    t.lineCount = (t.items || []).length;
    t.diffCount = (t.items || []).filter(function (x) {
      return Math.abs(Number(x.diffQty || 0)) > 1e-9;
    }).length;
    t.countedAll = t.items.length > 0 && t.items.every(function (x) { return x.status === "已盘"; });
    t.gate = stGateView(t);
    var row = find(DB.stocktakes.list, "no", t.no);
    if (row) { row.status = t.status; row.diffLines = t.diffLines; }
  }

  function refreshBoot() {
    var k = DB.boot.kpi, inbound = 0, outbound = 0, stockQty = 0, stockValue = 0;
    DB.moves.list.forEach(function (m) {
      if (m.ts.indexOf(today()) === 0) {
        if (m.type === "上架" || m.type === "收货") inbound += Number(m.qty || 0);
        if (m.type === "拣货出库") outbound += Number(m.qty || 0);
      }
    });
    stockRows().forEach(function (s) { stockQty += Number(s.qty || 0); stockValue += Number(s.amount || 0); });
    k.inboundToday = r2(inbound); k.outboundToday = r2(outbound);
    k.stockQty = r2(stockQty); k.stockValue = r2(stockValue / 10000.0);
    k.asnOpen = DB.asns.list.filter(function (x) {
      return ["已预约", "已到货", "收货中", "已收货"].indexOf(x.status) >= 0;
    }).length;
    k.soOpen = DB.orders.list.filter(function (x) {
      return ["已提交", "已分配", "拣货中", "已拣货", "已复核"].indexOf(x.status) >= 0;
    }).length;
    k.pickPending = DB.putaway ? 0 : k.pickPending;
    var busy = (DB.locations.list || []).filter(function (x) { return Number(x.used || 0) > 0; }).length;
    k.locBusy = busy; k.locTotal = (DB.locations.list || []).length;
    k.locUtil = r4(stockRows().length ?
      DB.locations.list.reduce(function (a, x) { return a + Number(x.util || 0); }, 0) /
      Math.max(1, (DB.locations.list || []).length) : 0);
  }

  /* ------------------------------------------------------------ 通用应答 */
  function ok(data) { return { status: 200, body: { ok: true, data: data } }; }
  function bad(msg, code) { return { status: code || 400, body: { ok: false, error: msg } }; }
  function need(list, kw) {
    if (!kw.q) return list;
    var q = String(kw.q).toLowerCase();
    return list.filter(function (x) {
      return JSON.stringify(x).toLowerCase().indexOf(q) >= 0;
    });
  }
  function kwOf(qs) { return qs; }

  /* ------------------------------------------------------------ 路由表 */
  var ROUTES = [];
  function on(method, re, fn) { ROUTES.push([method, re, fn]); }

  /* ---- 认证 ---- */
  on("GET", /^api\/auth\/me$/, function () { return ok(DB.me); });
  on("POST", /^api\/auth\/logout$/, function () { return ok({ logout: true }); });
  on("POST", /^api\/auth\/password$/, function () { return ok({ changed: true }); });
  on("GET", /^api\/bootstrap$/, function () { refreshBoot(); return ok(DB.boot); });

  /* ---- 主数据 ---- */
  on("GET", /^api\/warehouses$/, function () { return ok({ list: DB.warehouses.list, total: DB.warehouses.list.length }); });
  on("GET", /^api\/zones$/, function () { return ok({ list: DB.zones.list, total: DB.zones.list.length }); });
  on("GET", /^api\/locations$/, function (m, qs) {
    var list = DB.locations.list;
    if (qs.zone && qs.zone !== "全部") {
      list = list.filter(function (x) { return x.zone === qs.zone; });
    }
    if (qs.location) list = list.filter(function (x) { return x.code === qs.location; });
    return ok({ list: list, total: list.length });
  });
  on("GET", /^api\/items$/, function (m, qs) {
    var list = DB.items.list;
    if (qs.abc && qs.abc !== "全部") list = list.filter(function (x) { return x.abc === qs.abc; });
    if (qs.category && qs.category !== "全部") {
      list = list.filter(function (x) { return x.category === qs.category; });
    }
    if (qs.q) list = need(list, qs);
    return ok({ list: list, total: list.length });
  });
  on("GET", /^api\/items\/([A-Za-z0-9\-_]+)$/, function (m) {
    var d = DB.itemD[m[1]];
    return d ? ok(d) : bad("物料不存在：" + m[1], 404);
  });
  on("POST", /^api\/items$/, function (m, qs, b) {
    if (!b.code || !b.name) return bad("物料编码与名称不能为空");
    if (find(DB.items.list, "code", b.code)) return bad("物料编码已存在：" + b.code);
    var rec = { code: b.code, name: b.name, spec: b.spec || "", category: b.category || "其他",
      unit: b.unit || "件", abc: b.abc || "C", barcode: "", packQty: 0,
      length: Number(b.length || 0), width: Number(b.width || 0), height: Number(b.height || 0),
      weight: Number(b.weight || 0), cube: cubeOf(b.length, b.width, b.height),
      price: Number(b.price || 0), safety: Number(b.safetyStock || b.safety || 0),
      reorder: Number(b.reorder || 0), shelfLife: Number(b.shelfLife || 0),
      storage: b.storage || "常温", status: "启用", stockQty: 0, locCount: 0,
      level: "断货" };
    DB.items.list.unshift(rec);
    DB.itemD[b.code] = clone(rec);
    DB.itemD[b.code].stocks = []; DB.itemD[b.code].recentMoves = [];
    DB.itemD[b.code].recentOrders = []; DB.itemD[b.code].pickface = [];
    log("新建物料", b.code);
    return ok({ code: b.code, created: true });
  });
  on("PUT", /^api\/items\/([A-Za-z0-9\-_]+)$/, function (m, qs, b) {
    var it = find(DB.items.list, "code", m[1]);
    if (!it) return bad("物料不存在", 404);
    ["name", "spec", "category", "unit", "price", "safety", "safetyStock", "reorder",
      "shelfLife", "storage", "status", "abc"].forEach(function (k) {
      if (b[k] !== undefined) it[k] = b[k];
    });
    log("修改物料", m[1]);
    return ok({ code: m[1], updated: true });
  });
  [["suppliers"], ["customers"], ["carriers"]].forEach(function (pair) {
    var key = pair[0];
    on("GET", new RegExp("^api\\/" + key + "$"), function () {
      var list = DB[key].list;

    var t = { no: no, item: b.item, name: src.name, from_loc: src.location, to_loc: to,
      qty: Number(b.qty), status: "待执行", operator: "", created_at: nowStr(), done_at: "" };
    DB.replenish.tasks.unshift(t);
    DB.replenish.pending += 1;
    log("生成补货任务", no + " / " + b.item);
    return ok({ no: no, item: b.item, qty: Number(b.qty), from: src.location, to: to });
  });
  on("POST", /^api\/replenish\/([A-Za-z0-9\-]+)\/done$/, function (m, qs, b) {
    var t = find(DB.replenish.tasks, "no", m[1]);
    if (!t) return bad("补货任务不存在", 404);
    if (t.status === "已完成") return bad("该补货任务已完成");
    var qty = Number(b.qty || t.qty);
    var src = findStock(t.item, (findStock(t.item, "", t.from_loc) || {}).lot, t.from_loc);
    if (!src || Number(src.qty) < qty) return bad("存储区库存不足，无法补货");
    var lot = src.lot;
    takeStock(t.item, lot, t.from_loc, qty);
    addStock(t.item, lot, t.to_loc, qty, src.price, src.expiry);
    addMove("补货", t.item, lot, t.from_loc, t.to_loc, qty, t.no, "拣货面补货");
    t.status = "已完成"; t.operator = DB.me.username; t.done_at = nowStr();
    DB.replenish.pending = Math.max(0, (DB.replenish.pending || 1) - 1);
    log("补货完成", t.no + " / " + t.item + " " + qty);
    return ok({ no: t.no, status: "已完成", qty: qty });
  });
  on("GET", /^api\/transfers$/, function () {
    return ok({ list: DB.transfers.list, total: DB.transfers.list.length });
  });
  on("POST", /^api\/transfers$/, function (m, qs, b) {
    if (!b.item || !b.from || !b.to || !(Number(b.qty) > 0)) {
      return bad("物料、源货位、目标货位、数量都必须填写");
    }
    if (b.from === b.to) return bad("源货位与目标货位相同");
    if (!find(DB.locations.list, "code", b.to)) return bad("目标货位不存在：" + b.to);
    var s = find(DB.locations.list, "code", b.from);
    var row = stockRows().filter(function (x) {
      return x.item === b.item && x.location === b.from && Number(x.qty) >= Number(b.qty);
    })[0];
    if (!row) return bad("源货位没有足够的该物料库存");
    takeStock(b.item, row.lot, b.from, Number(b.qty));
    addStock(b.item, row.lot, b.to, Number(b.qty), row.price, row.expiry);
    var no = docNo(DB.transfers.list, "MV");
    DB.transfers.list.unshift({ no: no, item: b.item, lot: row.lot, from_loc: b.from,
      to_loc: b.to, qty: Number(b.qty), status: "已完成", operator: DB.me.username,
      created_at: nowStr() });
    addMove("移库", b.item, row.lot, b.from, b.to, Number(b.qty), no, b.note || "库内移库");
    log("库内移库", b.item + " " + b.from + " → " + b.to);
    return ok({ no: no, item: b.item, from: b.from, to: b.to, qty: Number(b.qty) });
  });
  on("POST", /^api\/moves$/, function (m, qs, b) {
    var types = ["移库", "盘盈", "盘亏", "调整", "退货入库", "报废"];
    if (types.indexOf(b.type) < 0) return bad("流水类型不合法：" + b.type);
    if (!b.item || !(Number(b.qty) > 0)) return bad("物料与数量不能为空");
    var qty = Number(b.qty);
    var row = stockRows().filter(function (x) {
      return x.item === b.item && (!b.lot || x.lot === b.lot) &&
        (!b.from || x.location === b.from);
    })[0];
    if (b.type !== "盘盈" && !row) return bad("源库存行不存在");
    if (row) {
      var lot = b.lot || row.lot;
      if (b.type === "移库" || b.type === "退货入库") {
        if (b.type === "移库") takeStock(b.item, lot, b.from, qty);
        addStock(b.item, lot, b.to, qty, row.price, row.expiry);
      } else if (b.type === "盘亏" || b.type === "报废") {
        takeStock(b.item, lot, b.from, qty);
      } else if (b.type === "盘盈") {
        addStock(b.item, lot, b.to || b.from || "A-01-01-1", qty, row.price, row.expiry);
      }
      addMove(b.type, b.item, lot, b.from || "", b.to || "", qty, b.ref || "", b.note || "手工操作");
      return ok({ type: b.type, item: b.item, lot: lot, qty: qty, from: b.from || "",
        to: b.to || "" });
    }
    return bad("源库存行不存在");
  });
  on("GET", /^api\/exceptions$/, function () {
    return ok({ list: DB.exceptions.list, total: DB.exceptions.list.length });
  });

  /* ---- 看板与报表 ---- */
  on("GET", /^api\/board$/, function () { refreshBoot(); return ok(DB.board); });
  on("GET", /^api\/reports$/, function (m, qs) { return ok(DB.reports); });

  /* ---- 设置 ---- */
  on("GET", /^api\/settings$/, function () { return ok(DB.settings); });
  on("PUT", /^api\/settings$/, function () { return ok({ saved: true }); });
  on("GET", /^api\/rules$/, function () {
    return ok({ list: DB.settings.rules });
  });
  on("PUT", /^api\/rules\/([a-z0-9_]+)$/, function (m, qs, b) {
    var r = find(DB.settings.rules, "code", m[1]);
    if (!r) return bad("规则不存在：" + m[1], 404);
    r.value = Number(b.value);
    log("调整规则", r.name + " = " + r.value);
    return ok({ code: r.code, value: r.value });
  });
  on("GET", /^api\/logs$/, function (m, qs) {
    var list = DB.__logs;
    return ok({ list: list.slice(0, Number(qs.limit || 200)), total: list.length + 200 });
  });
  on("GET", /^api\/users$/, function () {
    return ok({ list: DB.settings.users, total: DB.settings.users.length });
  });
  on("POST", /^api\/users$/, function (m, qs, b) {
    if (!b.username) return bad("用户名不能为空");
    if (find(DB.settings.users, "username", b.username)) return bad("用户名已存在");
    var rec = { username: b.username, displayName: b.displayName || b.username,
      role: b.role || "viewer", roleLabel: (b.role || "viewer") === "admin" ? "系统管理员" : "业务角色",
      dept: b.dept || "", status: "启用", createdAt: nowStr() };
    DB.settings.users.unshift(rec);
    log("新建账号", b.username);
    return ok({ username: rec.username, created: true });
  });

  /* ---- 集成 ---- */
  on("GET", /^api\/integration\/overview$/, function () { return ok(DB.integ.overview); });
  on("GET", /^api\/integration\/keys$/, function () {
    var list = DB.integ.keys.list;
    return ok({ list: list, active: list.filter(function (x) { return x.status === "启用"; }).length });
  });
  on("POST", /^api\/integration\/keys$/, function (m, qs, b) {
    if (!b.name) return bad("Key 名称不能为空");
    DB.__keySeq += 1;
    var raw = "fck_" + Math.random().toString(36).slice(2, 12) +
      Math.random().toString(36).slice(2, 8);
    var rec = { id: DB.__keySeq, name: b.name, prefix: raw.slice(0, 12),
      scope: b.scope || "read", owner: DB.me.username, status: "启用",
      createdAt: nowStr(), lastUsedAt: "", expiresAt: "" };
    DB.integ.keys.list.unshift(rec);
    log("创建 API Key", b.name);
    return ok({ id: rec.id, key: raw, name: b.name, scope: rec.scope,
      notice: "密钥只显示一次，请立即保存（DEMO 中刷新即失效）" });
  });
  on("DELETE", /^api\/integration\/keys\/(\d+)$/, function (m) {
    var rec = find(DB.integ.keys.list, "id", Number(m[1]));
    if (!rec) return bad("Key 不存在", 404);
    rec.status = "吊销";
    log("吊销 API Key", rec.name);
    return ok({ id: rec.id, status: rec.status });
  });
  on("GET", /^api\/integration\/webhooks$/, function () {
    return ok({ list: DB.integ.webhooks.list, total: DB.integ.webhooks.list.length });
  });
  on("POST", /^api\/integration\/webhooks$/, function (m, qs, b) {
    if (!b.name || !b.url) return bad("名称与回调地址不能为空");
    DB.__hookSeq += 1;
    var rec = { id: DB.__hookSeq, name: b.name, url: b.url, events: b.events || [],
      status: "启用", secret: "whsec_demo" + Math.random().toString(36).slice(2, 10),
      createdAt: nowStr(), deliveries: 0 };
    DB.integ.webhooks.list.unshift(rec);
    log("创建 Webhook", b.name);
    return ok({ id: rec.id, name: rec.name, events: rec.events, secret: rec.secret,
      notice: "签名密钥只显示一次，请妥善保存" });
  });
  on("PUT", /^api\/integration\/webhooks\/(\d+)$/, function (m, qs, b) {
    var rec = find(DB.integ.webhooks.list, "id", Number(m[1]));
    if (!rec) return bad("Webhook 不存在", 404);
    if (b.status) rec.status = b.status;
    if (b.events) rec.events = b.events;
    log("修改 Webhook", rec.name);
    return ok({ id: rec.id, status: rec.status });
  });
  on("DELETE", /^api\/integration\/webhooks\/(\d+)$/, function (m) {
    var id = Number(m[1]);
    DB.integ.webhooks.list = DB.integ.webhooks.list.filter(function (x) { return x.id !== id; });
    log("删除 Webhook", String(id));
    return ok({ id: id, deleted: true });
  });
  on("POST", /^api\/integration\/test$/, function () {
    var n = 0;
    DB.integ.webhooks.list.forEach(function (h) {
      if (h.status !== "启用") return;
      DB.__dlvSeq += 1;
      DB.integ.deliveries.list.unshift({ id: DB.__dlvSeq, webhookId: h.id,
        webhookName: h.name, event: "test.ping", status: "失败", attempts: 1, httpCode: 0,
        error: "离线演示环境无外网，投递记为失败", createdAt: nowStr(), deliveredAt: "" });
      h.deliveries = Number(h.deliveries || 0) + 1;
      n += 1;
    });
    log("测试事件", "test.ping × " + n);
    return ok({ event: "test.ping", queued: n });
  });
  on("GET", /^api\/integration\/deliveries$/, function () {
    var list = DB.integ.deliveries.list;
    return ok({ list: list, total: list.length,
      failed: list.filter(function (x) { return x.status === "失败"; }).length });
  });
  on("POST", /^api\/integration\/deliveries\/(\d+)\/retry$/, function (m) {
    var rec = find(DB.integ.deliveries.list, "id", Number(m[1]));
    if (!rec) return bad("投递记录不存在", 404);
    rec.attempts = Number(rec.attempts || 0) + 1;
    log("重投事件", rec.event + " #" + rec.id);
    return ok({ id: rec.id, attempts: rec.attempts, status: rec.status });
  });
  on("GET", /^api\/integration\/mappings$/, function () {
    return ok({ list: DB.integ.mappings.list, total: DB.integ.mappings.list.length });
  });
  on("POST", /^api\/integration\/mappings$/, function (m, qs, b) {
    if (!b.system || !b.objType || !b.extId || !b.localId) {
      return bad("系统、对象类型、外部 ID、本地 ID 都不能为空");
    }
    DB.__mapSeq += 1;
    var rec = { id: DB.__mapSeq, system: b.system, obj_type: b.objType,
      ext_id: b.extId, local_id: b.localId, created_at: nowStr() };
    DB.integ.mappings.list.unshift(rec);
    log("新增外部映射", b.extId);
    return ok({ id: rec.id });
  });
  on("POST", /^api\/integration\/resolve$/, function (m, qs, b) {
    var rec = DB.integ.mappings.list.filter(function (x) {
      return x.system === b.system && x.obj_type === b.objType &&
        (b.extId ? x.ext_id === b.extId : x.local_id === b.localId);
    })[0];
    if (b.extId) return ok({ found: !!rec, localId: rec ? rec.local_id : "", mapping: rec || {} });
    return ok({ found: !!rec, extId: rec ? rec.ext_id : "", mapping: rec || {} });
  });
  on("GET", /^api\/sync\/changes$/, function (m, qs) {
    var since = Number(qs.since || 0), limit = Math.min(500, Number(qs.limit || 100));
    var rows = DB.__changes.filter(function (c) { return c.id > since; }).slice(0, limit);
    var cursor = rows.length ? rows[rows.length - 1].id : since;
    return ok({ list: rows, cursor: cursor, count: rows.length,
      hasMore: DB.__changes.some(function (c) { return c.id > cursor; }),
      objects: ["asn", "order", "stock", "op"] });
  });
  on("GET", /^api\/health$/, function () {
    return ok({ status: "up", app: "飞传WMS", version: "1.0.0", mode: "demo", time: nowStr() });
  });

  /* ------------------------------------------------------------ fetch 拦截 */
  var _fetch = window.fetch;
  window.fetch = function (input, opt) {
    opt = opt || {};
    var url = String(input);
    var mp = url.match(/api\/[^?#]+/);
    if (!mp) return _fetch ? _fetch(input, opt) : Promise.reject(new Error("no fetch"));
    var path = mp[0].replace(/^\//, "");
    var qs = {};
    var q2 = url.split("?")[1] || "";
    q2.split("&").forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf("=");
      qs[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] =
        decodeURIComponent(i < 0 ? "" : kv.slice(i + 1).replace(/\+/g, " "));
    });
    if (path.indexOf("?") >= 0) path = path.slice(0, path.indexOf("?"));
    var method = String(opt.method || "GET").toUpperCase();
    var body = {};
    if (opt.body) { try { body = JSON.parse(opt.body); } catch (e) { body = {}; } }
    var result = null;
    try {
      for (var i = 0; i < ROUTES.length; i++) {
        var r = ROUTES[i];
        if (r[0] !== method) continue;
        var m2 = path.match(r[1]);
        if (!m2) continue;
        result = r[2](m2, qs, body);
        break;
      }
    } catch (e) {
      result = bad(e.message || "服务异常", 400);
    }
    if (!result) result = bad("接口未实现（DEMO）：" + method + " " + path, 404);
    persist();
    var resp = {
      ok: result.status < 400,
      status: result.status,
      json: function () { return Promise.resolve(result.body); },
      text: function () { return Promise.resolve(JSON.stringify(result.body)); }
    };
    return Promise.resolve(resp);
  };

  /* CSV 导出（内存生成） */
  var _open = window.open;
  window.open = function (u) {
    if (String(u).indexOf("/api/export/orders.csv") === 0) {
      var lines = [["出库单号", "客户", "优先级", "承运商", "状态", "行数", "数量", "已拣",
        "满足率", "运单号", "创建时间"].join(",")];
      DB.orders.list.forEach(function (o) {
        lines.push([o.no, o.customerName, o.priority, o.carrier, o.status, o.lineCount,
          o.qty, o.pickedQty, Math.round(Number(o.fillRate || 0) * 100) + "%",
          o.trackingNo || "", o.createdAt].join(","));
      });
      var blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "feichuan_orders.csv";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
      return null;
    }
    if (String(u).indexOf("/api/export/stock.csv") === 0) {
      var rows = [["物料编码", "物料名称", "批次", "货位", "数量", "锁定", "可用", "金额",
        "有效期"].join(",")];
      stockRows().forEach(function (s) {
        rows.push([s.item, s.name, s.lot, s.location, s.qty, s.allocated, s.avail,
          s.amount, s.expiry || ""].join(","));
      });
      var blob2 = new Blob(["\ufeff" + rows.join("\n")], { type: "text/csv;charset=utf-8" });
      var a2 = document.createElement("a");
      a2.href = URL.createObjectURL(blob2);
      a2.download = "feichuan_stock.csv";
      document.body.appendChild(a2);
      a2.click();
      setTimeout(function () { URL.revokeObjectURL(a2.href); a2.remove(); }, 800);
      return null;
    }
    return _open ? _open.apply(window, arguments) : null;
  };

  /* 绕过登录页 */
  try {
    localStorage.setItem("wms_token", "demo-token");
    localStorage.setItem("fc_user", "admin");
    localStorage.setItem("fc_name", "系统管理员");
    localStorage.setItem("fc_role", "admin");
    localStorage.setItem("fc_role_label", "系统管理员");
  } catch (e) { /* 隐私模式忽略 */
  }
})();

</script>
<script>
/* 飞传 WMS · 前端框架、仓储驾驶舱、基础设置与操作日志（原生 JS，零依赖） */
(function (window, document) {
  "use strict";

  var F = window.F = {};
  var TOKEN_KEY = "wms_token";

  F.state = { boot: null, route: "dashboard", params: {}, timer: null };

  /* ---------------------------------------------------------- 基础工具 */
  F.esc = function (s) {
    return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  F.num = function (v, d) {
    var n = Number(v || 0);
    return n.toLocaleString("zh-CN", { minimumFractionDigits: d === undefined ? 2 : d,
      maximumFractionDigits: d === undefined ? 2 : d });
  };
  F.int = function (v) { return F.num(v, 0); };
  F.qty = function (v) {
    var n = Number(v || 0);
    return Number.isInteger(n) ? F.int(n) : F.num(n, 1);
  };
  F.wan = function (v) {
    var n = Number(v || 0);
    return Math.abs(n) >= 10000 ? (n / 10000).toFixed(1) + " 万" : F.num(n, 0);
  };
  F.pct = function (v, d) {
    var n = Number(v || 0) * 100;
    return n.toFixed(d === undefined ? 1 : d) + "%";
  };
  F.cube = function (v) {
    var n = Number(v || 0);
    return n >= 1 ? n.toFixed(1) + " m³" : (n * 1000).toFixed(0) + " L";
  };
  F.today = function () { return new Date().toISOString().slice(0, 10); };
  F.qs = function (o) {
    return Object.keys(o || {}).filter(function (k) { return o[k] !== undefined && o[k] !== null; })
      .map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(o[k]); }).join("&");
  };
  F.dash = function (v) { return v === null || v === undefined || v === "" ? "—" : v; };

  var TAGS = {
    // 入库
    "草稿": "gray", "已预约": "blue", "已到货": "gold", "收货中": "gold",
    "已收货": "blue", "已上架": "green", "已关闭": "gray", "已取消": "gray",
    // 出库
    "已提交": "blue", "已分配": "blue", "拣货中": "gold", "已拣货": "gold",
    "已复核": "green", "已发运": "green", "已签收": "green",
    // 盘点 / 任务
    "盘点中": "gold", "待审核": "gold", "已调整": "green", "待拣": "gold", "已拣": "green",
    "待执行": "gold", "已完成": "green", "待盘": "gold", "已盘": "green",
    // 效期与水位
    "已过期": "red", "临期": "gold", "关注": "blue", "正常": "green",
    "充足": "green", "偏低": "gold", "不足": "red", "断货": "red",
    "盘平": "green", "盘盈": "blue", "盘亏": "red",
    // 异常与优先级
    "待处理": "red", "处理中": "gold",
    "特急": "red", "加急": "gold", "普通": "gray",
    "高": "red", "中": "gold", "低": "gray",
    // 状态通用
    "启用": "green", "停用": "gray", "吊销": "red", "禁用": "gray",
    "成功": "green", "失败": "red", "待投递": "gold",
    "运行": "green", "空闲": "gray", "占用": "blue", "锁定": "gold",
    "A": "green", "B": "blue", "C": "gold"
  };
  F.TAGS = TAGS;
  F.tag = function (s, cls) {
    return '<span class="tag ' + (cls || TAGS[s] || "gray") + '">' + F.esc(s) + "</span>";
  };
  F.prio = function (p) { return F.tag(p, p === "特急" ? "red" : (p === "加急" ? "gold" : "gray")); };

  /* ---------------------------------------------------------- 请求 */
  F.raw = function (method, path, body, headers) {
    var h = { "Content-Type": "application/json" };
    var tk = localStorage.getItem(TOKEN_KEY);
    if (tk) { h.Authorization = "Bearer " + tk; h["X-Fc-Token"] = tk; }
    Object.keys(headers || {}).forEach(function (k) { h[k] = headers[k]; });
    var opt = { method: method, headers: h, credentials: "same-origin" };
    if (body !== undefined && body !== null) opt.body = JSON.stringify(body);
    return fetch(path.replace(/^\//, ""), opt).then(function (r) {
      return r.json().catch(function () { return { error: "响应解析失败" }; })
        .then(function (j) { return { status: r.status, body: j }; });
    });
  };

  F.api = function (method, path, body) {
    return F.raw(method, path, body).then(function (x) {
      if (x.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        location.href = "./login.html";
        return new Promise(function () {});
      }
      if (x.status >= 400) {
        var e = new Error((x.body && x.body.error) || ("请求失败 " + x.status));
        e.status = x.status;
        e.body = x.body;
        throw e;
      }
      return x.body.data;
    });
  };

  F.toast = function (msg, kind) {
    var el = document.getElementById("statusMsg");
    if (!el) return;

    F._toastUntil = Date.now() + 6000;
    el.style.color = kind === "err" ? "#ffb3a7" : (kind === "ok" ? "#9ee6b8" : "");
    clearTimeout(F._t);
    F._t = setTimeout(function () { el.style.color = ""; }, 8000);
  };
  F.setStatus = function (t) {
    var el = document.getElementById("statusMsg");
    if (!el) return;
    if (F._toastUntil && Date.now() < F._toastUntil) return;

  };
  F.setSide = function (html) { var el = document.getElementById("side"); if (el) el.innerHTML = html; };

  F.can = function (perm) {
    var b = F.state.boot;
    return !!(b && b.user && (b.user.perms || []).indexOf(perm) >= 0);
  };
  F.isAdmin = function () { return F.state.boot && F.state.boot.user.role === "admin"; };
  F.me = function () { return (F.state.boot && F.state.boot.user) || {}; };

  /* ---------------------------------------------------------- 路由 */
  function parseHash() {
    var h = (location.hash || "#dashboard").replace(/^#\/?/, "");
    var i = h.indexOf("?");
    var route = i < 0 ? h : h.slice(0, i);
    var qs = i < 0 ? "" : h.slice(i + 1);
    var params = {};
    qs.split("&").forEach(function (kv) {
      if (!kv) return;
      var j = kv.indexOf("=");
      params[decodeURIComponent(j < 0 ? kv : kv.slice(0, j))] =
        decodeURIComponent(j < 0 ? "" : kv.slice(j + 1));
    });
    return { route: route || "dashboard", params: params };
  }

  F.go = function (route, params) {
    location.hash = "#" + route + (params && Object.keys(params).length ? "?" + F.qs(params) : "");
  };

  var PAGES = {};
  F.register = function (name, fn) { PAGES[name] = fn; };

  function render() {
    var r = parseHash();
    F.state.route = r.route;
    F.state.params = r.params;
    if (F.state.timer) { clearInterval(F.state.timer); F.state.timer = null; }
    var fn = PAGES[r.route] || PAGES.dashboard;
    var view = document.getElementById("view");
    view.innerHTML = "";
    paintNav(r.route);
    try {
      fn(r.params);
    } catch (e) {
      view.innerHTML = '<div class="panel"><div class="panel-body">页面渲染失败：' +
        F.esc(e.message) + "</div></div>";
    }
  }
  F.render = render;

  /* ---------------------------------------------------------- 导航 */
  var TREE = [
    { grp: "作业执行", items: [["dashboard", "仓储驾驶舱"], ["inbound", "入库作业"],
      ["outbound", "出库作业"], ["wave", "波次拣货"], ["stocktake", "盘点作业"]] },
    { grp: "库存管理", items: [["stock", "库存台账"], ["locations", "库位管理"],
      ["replenish", "补货移库"], ["trace", "批次追溯"]] },
    { grp: "主数据", items: [["items", "物料主数据"], ["partners", "往来单位"]] },
    { grp: "分析", items: [["reports", "报表分析"]] },
    { grp: "系统", items: [["integration", "集成中心"], ["settings", "基础设置"],
      ["logs", "操作日志"]] }
  ];

  var MENU = TREE.map(function (g) { return [g.grp, g.items.map(function (i) { return i[0]; })]; });

  var TITLE = {
    dashboard: "仓储驾驶舱", inbound: "入库作业", outbound: "出库作业", wave: "波次拣货",
    stocktake: "盘点作业", stock: "库存台账", locations: "库位管理", replenish: "补货移库",
    trace: "批次追溯", items: "物料主数据", partners: "往来单位", reports: "报表分析",
    integration: "集成中心", settings: "基础设置", logs: "操作日志"
  };
  F.TITLE = TITLE;

  function paintNav(route) {
    var tree = document.getElementById("tree");
    var boot = F.state.boot || {};
    var kpi = boot.kpi || {};
    var badgeFor = {
      dashboard: (boot.todo || []).length,
      inbound: kpi.waitReceive || 0,
      outbound: kpi.soOpen || 0,
      wave: kpi.waveOpen || 0,
      replenish: kpi.replenishOpen || 0,
      stock: kpi.expiryWarn || 0
    };
    tree.innerHTML = TREE.map(function (g) {
      return '<div class="grp">' + F.esc(g.grp) + "</div>" + g.items.map(function (it) {
        var n = badgeFor[it[0]] || 0;
        var badge = n ? '<b class="nav-badge">' + n + "</b>" : "";
        return '<a href="#' + it[0] + '" class="' + (it[0] === route ? "on" : "") + '">' +
          F.esc(it[1]) + badge + "</a>";
      }).join("");
    }).join("");

    var mb = document.getElementById("menubar");
    var groupOf = {};
    MENU.forEach(function (m) { m[1].forEach(function (r) { groupOf[r] = m[0]; }); });
    mb.innerHTML = MENU.map(function (m) {
      return '<button class="' + (groupOf[route] === m[0] ? "on" : "") + '" data-group="' +
        F.esc(m[0]) + '">' + F.esc(m[0]) + "</button>";
    }).join("");
    mb.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () {
        var g = b.getAttribute("data-group");
        var target = MENU.filter(function (m) { return m[0] === g; })[0];
        if (target) F.go(target[1][0]);
      });
    });

    var ts = document.getElementById("tabstrip");
    ts.innerHTML = '<span class="tab">' + F.esc(TITLE[route] || route) + "</span>" +
      '<span class="muted small">飞传 WMS / ' + F.esc(TITLE[route] || route) + "</span>";
  }

  /* ---------------------------------------------------------- 通用渲染 */
  F.table = function (headers, rows, opts) {
    opts = opts || {};
    var th = headers.map(function (h) {
      return "<th class='" + (h.num ? "num" : "") + "'" +
        (h.width ? " style='width:" + h.width + "'" : "") + ">" + F.esc(h.label) + "</th>";
    }).join("");
    var body = rows && rows.length ? rows.map(function (r, i) {
      return '<tr class="' + (opts.click ? "clickable" : "") + '"' +
        (opts.click ? " data-key='" + F.esc(opts.click(r, i)) + "'" : "") + ">" +
        headers.map(function (h) {
          var v = h.render ? h.render(r, i) : F.esc(r[h.key]);
          return "<td class='" + (h.num ? "num" : "") + "'>" + v + "</td>";
        }).join("") + "</tr>";
    }).join("") : '<tr class="empty-row"><td colspan="' + headers.length + '">' +
      F.esc(opts.empty || "暂无数据") + "</td></tr>";
    return "<table class='grid-table'><thead><tr>" + th + "</tr></thead><tbody>" + body + "</tbody></table>";
  };

  F.bindRows = function (root, fn) {
    (root || document).querySelectorAll("#view tbody tr[data-key]").forEach(function (tr) {
      tr.addEventListener("click", function () { fn(tr.getAttribute("data-key"), tr); });
    });
  };

  F.dialog = function (title, body, foot) {
    var mask = document.getElementById("mask");
    var dlg = document.getElementById("dialog");
    dlg.className = "dialog" + (F._wide ? " wide" : "");
    F._wide = false;
    dlg.innerHTML = '<div class="dh">' + F.esc(title) +
      '<span class="x" data-close="1">×</span></div><div class="db">' + body + "</div>" +
      (foot ? '<div class="df">' + foot + "</div>" : "");
    mask.className = "mask on";
    dlg.querySelector("[data-close]").addEventListener("click", F.closeDialog);
    return dlg;
  };
  F.dialogWide = function (title, body, foot) { F._wide = true; return F.dialog(title, body, foot); };
  F.closeDialog = function () { document.getElementById("mask").className = "mask"; };
  F.dialogOpen = function () {
    return document.getElementById("mask").className.indexOf("on") >= 0;
  };

  F.chips = function (items, active, attr) {
    return '<div class="chips">' + items.map(function (it) {
      var val = typeof it === "string" ? it : it[0];
      var label = typeof it === "string" ? it : it[1];
      var count = typeof it === "string" ? "" : (
        it[2] === undefined || it[2] === null ? "" : '<span class="chip-n">' + it[2] + "</span>");
      return '<button class="chip' + (val === active ? " on" : "") + '" ' + (attr || "data-st") +
        '="' + F.esc(val) + '">' + F.esc(label) + count + "</button>";
    }).join("") + "</div>";
  };

  F.lineChart = function (series, opts) {
    opts = opts || {};
    var W = opts.width || 640, H = opts.height || 190, P = 34;
    var labels = opts.labels || [];
    var all = [];
    series.forEach(function (s) { all = all.concat(s.data); });
    var max = Math.max.apply(null, all.concat([1]));
    var min = opts.zero === false ? Math.min.apply(null, all) : 0;
    var span = max - min || 1;
    var colors = opts.colors || ["#1f7a8c", "#c8963e", "#b4463a"];
    var w = (W - P * 2) / Math.max(1, labels.length - 1);
    var grid = [0, 0.25, 0.5, 0.75, 1].map(function (t) {
      var y = P + (H - P * 1.6) * t;
      var val = max - span * t;
      return '<line x1="' + P + '" y1="' + y + '" x2="' + (W - P) + '" y2="' + y +
        '" stroke="#eef2f5"/><text x="6" y="' + (y + 4) + '" font-size="10" fill="#8b9aa6">' +
        (val >= 10000 ? (val / 10000).toFixed(1) + "万" : Math.round(val)) + "</text>";
    }).join("");
    var paths = series.map(function (s, si) {
      var d = s.data.map(function (v, i) {
        var x = P + w * i;
        var y = P + (H - P * 1.6) * (1 - (v - min) / span);
        return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      }).join(" ");
      return '<path d="' + d + '" fill="none" stroke="' + colors[si % colors.length] +
        '" stroke-width="2"/>' + s.data.map(function (v, i) {
          var x = P + w * i;
          var y = P + (H - P * 1.6) * (1 - (v - min) / span);
          return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.6" fill="' +
            colors[si % colors.length] + '"/>';
        }).join("");
    }).join("");
    var xlabels = labels.map(function (t, i) {
      return '<text x="' + (P + w * i) + '" y="' + (H - 6) +
        '" font-size="10" fill="#8b9aa6" text-anchor="middle">' + F.esc(t) + "</text>";
    }).join("");
    var legend = series.map(function (s, si) {
      return '<span class="lg-dot"><i style="background:' + colors[si % colors.length] + '"></i>' +
        F.esc(s.name) + "</span>";
    }).join("");
    return '<div class="chart-legend">' + legend + "</div>" +
      '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '">' +
      grid + paths + xlabels + "</svg>";
  };

  F.barChart = function (items, opts) {
    opts = opts || {};
    var W = opts.width || 640, H = opts.height || 180, P = 34;
    var max = Math.max.apply(null, items.map(function (i) { return i.value; }).concat([1]));
    var gap = (W - P * 2) / Math.max(1, items.length);
    var bw = gap * 0.56;
    return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" height="' + H + '">' +
      items.map(function (it, i) {
        var h = (H - P * 1.8) * (it.value / max);
        var x = P + gap * i + (gap - bw) / 2;
        var y = H - P - h;
        return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) +
          '" height="' + Math.max(1, h).toFixed(1) + '" rx="2" fill="' + (it.color || "#2b9eb3") + '"/>' +
          '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 5) +
          '" font-size="10" fill="#5d6f7c" text-anchor="middle">' + F.esc(it.label2 || "") +
          "</text>" + '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) +
          '" font-size="10" fill="#8b9aa6" text-anchor="middle">' + F.esc(it.label) + "</text>";
      }).join("") + "</svg>";
  };

  /* 状态分布条 */
  F.stageBars = function (stages) {
    var max = Math.max.apply(null, stages.map(function (s) { return s.count; }).concat([1]));
    return '<div class="funnel">' + stages.map(function (s) {
      var w = Math.max(5, Math.round(s.count / max * 100));
      var color = TAGS[s.status] === "gold" ? "#c8963e" : (TAGS[s.status] === "green" ? "#2f8f5b" :
        (TAGS[s.status] === "red" ? "#b4463a" : "#2b7fa8"));
      return '<div class="fn-row"><div class="fn-name">' + F.esc(s.status) + "</div>" +
        '<div class="fn-bar"><i style="width:' + w + "%;background:" + color + '"></i></div>' +
        '<div class="fn-val">' + s.count + ' <span class="muted small">单</span></div>' +
        '<div class="fn-conv"></div></div>';
    }).join("") + "</div>";

    var deg = (p * 360).toFixed(1);
    return '<div class="ring" style="background:conic-gradient(' + color + " 0deg " + deg +
      "deg,#eef2f5 " + deg + 'deg 360deg)"><div class="ring-in"><b>' + F.pct(p, opts.d === undefined ? 1 : opts.d) +
      "</b><span>" + F.esc(opts.label || "利用率") + "</span></div></div>";

  /* ---------------------------------------------------------- 驾驶舱 */

      var html = '<div class="panel"><div class="panel-title">' +
        F.chips([["warehouse", "仓库与库区"], ["rules", "业务规则"],
          ["users", "账号与权限"], ["about", "系统信息"]], tab, "data-tab") +
        "</div><div class='panel-body' id='setBody'></div></div>";
      document.getElementById("view").innerHTML = html;

      var body = document.getElementById("setBody");
      function paint(t) {
        if (t === "warehouse") {
          body.innerHTML = "<div class='sub-title'>仓库</div>" +
            F.table([
              { label: "编码", render: function (r) { return '<span class="mono">' + F.esc(r.code) + "</span>"; } },
              { label: "名称", key: "name" }, { label: "城市", key: "city" },
              { label: "面积（㎡）", num: true, render: function (r) { return F.num(r.area, 0); } },
              { label: "负责人", key: "manager" },
              { label: "状态", render: function (r) { return F.tag(r.status); } }
            ], d.warehouses) +
            "<div class='sub-title'>库区与库容</div>" +
            F.table([
              { label: "库区", render: function (r) { return '<b>' + F.esc(r.code) + "</b> " + F.esc(r.name); } },
              { label: "类型", render: function (r) { return F.tag(r.kind, "gray"); } },
              { label: "温层", key: "temp" },
              { label: "货位", num: true, render: function (r) { return r.locCount; } },
              { label: "库存", num: true, render: function (r) { return F.qty(r.stockQty); } },
              { label: "利用率", render: function (r) {
                return '<div class="util-cell">' + F.progress(r.util) +
                  '<span class="small">' + F.pct(r.util, 0) + "</span></div>";
              } }
            ], d.zones);
        } else if (t === "rules") {
          var cats = {};
          (d.rules || []).forEach(function (r) { (cats[r.category] = cats[r.category] || []).push(r); });
          body.innerHTML = Object.keys(cats).map(function (c) {
            return '<div class="sub-title">' + F.esc(c) + "</div>" + F.table([
              { label: "规则", render: function (r) { return F.esc(r.name) +
                ' <span class="muted small mono">' + F.esc(r.code) + "</span>"; } },
              { label: "当前值", num: true, render: function (r) {
                return '<input class="inp sm" data-rule="' + F.esc(r.code) + '" value="' +
                  r.value + '" style="width:90px"> <span class="muted small">' + F.esc(r.unit) + "</span>";
              } },
              { label: "说明", render: function (r) { return '<span class="small muted">' +
                F.esc(r.remark) + "</span>"; } },
              { label: "状态", render: function (r) { return F.tag(r.enabled ? "启用" : "停用"); } }
            ], cats[c]);
          }).join("") + (admin ? '<div class="form-foot"><button class="btn primary" id="ruleSave">' +
            "保存规则</button></div>" : '<div class="muted small">仅管理员可修改规则</div>');
          var sv = document.getElementById("ruleSave");
          if (sv) sv.addEventListener("click", function () {
            var list = [];
            body.querySelectorAll("[data-rule]").forEach(function (i) {
              list.push([i.getAttribute("data-rule"), i.value]);
            });
            var seq = Promise.resolve();
            list.forEach(function (x) {
              seq = seq.then(function () {
                return F.api("PUT", "/api/rules/" + x[0], { value: Number(x[1]) });
              });
            });
            seq.then(function () {
              F.toast("规则已保存", "ok");
              F.boot();
            }).catch(function (e) { F.toast(e.message, "err"); });
          });
        } else if (t === "users") {
          body.innerHTML = (admin ? '<div class="form-foot" style="justify-content:flex-start">' +
            '<button class="btn primary" id="uNew">新建账号</button></div>' : "") +
            F.table([
              { label: "账号", render: function (r) { return '<span class="mono">' + F.esc(r.username) + "</span>"; } },
              { label: "姓名", key: "displayName" },
              { label: "角色", render: function (r) { return F.tag(r.roleLabel, "blue"); } },
              { label: "部门", key: "dept" }, { label: "手机", key: "phone" },
              { label: "状态", render: function (r) { return F.tag(r.status); } }
            ], d.users) +
            "<div class='sub-title'>角色权限矩阵</div>" +
            F.table([{ label: "角色", render: function (r) { return F.esc(r.label) +
              ' <span class="muted small mono">' + F.esc(r.role) + "</span>"; } },
              { label: "权限", render: function (r) {
                return (r.perms || []).map(function (p) {
                  return '<span class="tag gray">' + F.esc(d.permLabel[p] || p) + "</span>";
                }).join(" ");
              } }], d.roles);
          var nb = document.getElementById("uNew");
          if (nb) nb.addEventListener("click", function () {
            F.dialog("新建账号",
              '<div class="form-grid">' +
              '<label>账号<input id="nuName" placeholder="小写字母/数字"></label>' +
              '<label>姓名<input id="nuDisplay"></label>' +
              '<label>角色<select id="nuRole">' + (d.roles || []).map(function (r) {
                return '<option value="' + F.esc(r.role) + '">' + F.esc(r.label) + "</option>";
              }).join("") + "</select></label>" +
              '<label>部门<input id="nuDept" placeholder="如 仓储部"></label>' +
              '<label>初始密码<input id="nuPwd" value="wh@2026"></label></div>',
              '<button class="btn" id="nuOk">创建</button>');
            document.getElementById("nuOk").addEventListener("click", function () {
              F.api("POST", "/api/users", {
                username: document.getElementById("nuName").value.trim(),
                displayName: document.getElementById("nuDisplay").value.trim(),
                role: document.getElementById("nuRole").value,
                dept: document.getElementById("nuDept").value.trim(),
                password: document.getElementById("nuPwd").value
              }).then(function () {
                F.closeDialog(); F.toast("账号已创建", "ok"); F.go("settings", { tab: "users" });
              }).catch(function (e) { F.toast(e.message, "err"); });
            });
          });
        } else {
          body.innerHTML = '<div class="kv-grid">' +
            F.kv("系统名称", "飞传 WMS · 仓储执行系统") +
            F.kv("版本", d.version) +
            F.kv("接口条目", "GET /api/openapi.json") +
            F.kv("物料数", d.counts.items) +
            F.kv("货位数", d.counts.locations) +
            F.kv("库区数", d.counts.zones) +
            F.kv("批次数", d.counts.lots) +
            F.kv("流水数", d.counts.moves) +
            "</div>" +
            '<div class="sub-title">部署与对接说明</div>' +
            '<div class="panel-body small muted" style="line-height:2">' +
            "· 零第三方依赖：Python 标准库 http.server + SQLite（WAL），单进程即可运行。<br>" +
            "· 前端为原生 HTML/CSS/JS，无构建步骤，hash 路由；同一份静态资源可由任意反向代理托管。<br>" +
            "· 与 ERP / MES / TMS 对接走「三通道」：API Key（fck_ 前缀）、Webhook（HMAC-SHA256 签名）、" +
            "增量同步 /api/sync/changes 游标拉取。<br>" +
            "· 令牌支持 Authorization / X-Fc-Token / Cookie / 查询串多通道携带，避免代理改写导致掉登录。</div>";
        }
      }
      paint(tab);
      document.querySelectorAll("[data-tab]").forEach(function (b) {
        b.addEventListener("click", function () {
          document.querySelectorAll("[data-tab]").forEach(function (x) { x.className = "chip"; });
          b.className = "chip on";
          paint(b.getAttribute("data-tab"));
        });
      });
      F.setStatus("基础设置 · " + (TITLE[F.state.route] || ""));
    }).catch(function (e) { F.toast(e.message, "err"); });
  });

  /* ---------------------------------------------------------- 操作日志 */
  F.register("logs", function () {
    var q = F.state.params.q || "";
    F.api("GET", "/api/logs?limit=200" + (q ? "&q=" + encodeURIComponent(q) : ""))
      .then(function (d) {
        var html = '<div class="panel"><div class="panel-title">操作日志' +
          '<span class="panel-actions">' +
          '<input class="inp sm" id="logQ" placeholder="搜索动作或详情" value="' + F.esc(q) + '">' +
          '<button class="btn sm" id="logGo">查询</button></span></div>' +
          '<div class="panel-body flush">' +
          F.table([
            { label: "时间", render: function (r) { return '<span class="mono small">' +
              F.esc(r.created_at) + "</span>"; } },
            { label: "操作人", render: function (r) { return F.esc(r.username); } },
            { label: "动作", render: function (r) { return F.tag(r.action, "blue"); } },
            { label: "详情", render: function (r) { return '<span class="small">' + F.esc(r.detail) + "</span>"; } }
          ], d.list, { empty: "暂无日志" }) + "</div></div>";
        document.getElementById("view").innerHTML = html;
